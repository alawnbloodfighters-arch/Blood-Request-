<title>শেষের আবেদনগুলি</title><style>

body {

    margin: 0;

    padding: 20px 15px;

    background: #f5f5f5;

        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow-x: hidden;

    background: #ffe6e6;

    color: #c00000;

.message-button:active {

    transform: scale(0.98);

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    font-size: 21px;

    padding: 30px;

}


.error {

    text-align: center;

    color: #d00000;

    text-align: center;

    padding: 30px;

}

   MOBILE
========================= */

    body {

        padding:
            12px 8px;

        font-size: 26px;

            8px 0 22px;

    }


    .card {

        padding:
            18px 15px 16px 20px;

        border-radius: 20px;

        margin-bottom: 18px;

        border-left-width: 7px;

    }


    .blood-group {

        font-size: 32px;

        margin-bottom: 18px;

    }


    .row {

        font-size: 17px;

        margin: 11px 0;

        line-height: 1.45;

    }


    .update {

        font-size: 17px;

        margin-top: 18px;

        padding:
            11px 13px;

    }

</style></head><body><div class="container"><div class="title">

    🩸
    <span>
        শেষের আবেদনগুলি
    </span>

</div>


<div id="requestList">

    <div class="loading">

        ⏳ Login যাচাই করা হচ্ছে...

    </div>

</div>

</div><script type="module">

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    update

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// GLOBAL
// ==========================================

let currentUser = null;

let isAdmin = false;

let authReady = false;



// ==========================================
// REQUEST LIST ELEMENT
// ==========================================

const requestList =
    document.getElementById(
        "requestList"
    );



// ==========================================
// AUTH
// ==========================================

onAuthStateChanged(

    auth,

    async function(user) {

        currentUser = user;

        isAdmin = false;

        authReady = true;


        // ==================================
        // LOGIN না থাকলে
        // ==================================

        if (!user) {

            requestList.innerHTML = `

                <div class="error">

                    ⚠️ আবেদন দেখতে আগে Login করুন।

                    <br><br>

                    Login করার পর আবার
                    "আবেদন দেখুন" চাপুন।

                </div>

            `;

            return;

        }


        // ==================================
        // ADMIN CHECK
        // ==================================

        try {

            const userSnapshot =
                await new Promise(
                    function(resolve, reject) {

                        onValue(

                            ref(
                                db,
                                "users/" +
                                user.uid
                            ),

                            resolve,

                            {
                                onlyOnce: true
                            }

                        );

                    }
                );


            const userData =
                userSnapshot.val();


            if (
                userData &&
                userData.role === "admin"
            ) {

                isAdmin = true;

            }

        }

        catch(error) {

            console.error(
                "Admin check error:",
                error
            );

        }


        // ==================================
        // AUTH CONFIRMED
        // তারপর Request Load
        // ==================================

        loadRequests();

    }

);



// ==========================================
// DATE
// ==========================================

function formatDate(value) {

    if (!value) {

        return "";

    }


    const dateString =
        String(value).trim();


    const match =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        return (
            match[3] +
            "/" +
            match[2] +
            "/" +
            match[1]
        );

    }


    return dateString;

}



// ==========================================
// UPDATE COLOR
// ==========================================

function getUpdateClass(status) {

    const text =
        String(status || "")
        .trim()
        .toLowerCase();


    if (
        text === "managed"
    ) {

        return "green";

    }


    if (
        text === "pending"
    ) {

        return "yellow";

    }


    if (
        text === "request cancelled"
    ) {

        return "red";

    }


    return "blue";

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// LOAD REQUESTS
// ==========================================

function loadRequests() {


    // ==================================
    // EXTRA AUTH SAFETY CHECK
    // ==================================

    if (!authReady || !currentUser) {

        requestList.innerHTML = `

            <div class="error">

                ⚠️ আবেদন দেখতে আগে Login করুন।

            </div>

        `;

        return;

    }


    // ==================================
    // DATABASE READ
    // ==================================

    onValue(

        ref(
            db,
            "bloodRequests"
        ),

        function(snapshot) {


            const value =
                snapshot.val();


            if (!value) {

                requestList.innerHTML = `

                    <div class="empty">

                        📭 এখন কোনো রক্তের আবেদন নেই।

                    </div>

                `;

                return;

            }


            const requests =
                Object.values(value);


            requests.sort(

                function(a, b) {

                    return (
                        Number(
                            b.createdAt || 0
                        ) -
                        Number(
                            a.createdAt || 0
                        )
                    );

                }

            );


            requestList.innerHTML = "";


            requests.forEach(

                function(item) {


                    const requestId =
                        escapeHtml(
                            item.requestId
                        );


                    const reference =
                        escapeHtml(
                            item.reference
                        );


                    const problem =
                        escapeHtml(
                            item.problem
                        );


                    const bloodGroup =
                        escapeHtml(
                            item.bloodGroup
                        );


                    const hemoglobin =
                        escapeHtml(
                            item.hemoglobin
                        );


                    const date =
                        escapeHtml(
                            formatDate(
                                item.date
                            )
                        );


                    const time =
                        escapeHtml(
                            item.time
                        );


                    const hospital =
                        escapeHtml(
                            item.hospital
                        );


                    const mobile =
                        escapeHtml(
                            item.mobile
                        );


                    const status =
                        item.status ||
                        "No Update";


                    const updateClass =
                        getUpdateClass(
                            status
                        );


                    const canChangeStatus =
                        currentUser &&
                        (
                            isAdmin ||
                            currentUser.uid === item.uid
                        );



                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";



                    card.innerHTML = `

                        <div class="blood-group">

                            🩸
                            ${bloodGroup}

                        </div>


                        <div class="row">

                            👤

                            <strong>
                                রেফারেন্স:
                            </strong>

                            ${reference}

                        </div>


                        <div class="row">

                            🩺

                            <strong>
                                রোগীর সমস্যা:
                            </strong>

                            ${problem}

                        </div>


                        <div class="row">

                            🧪

                            <strong>
                                হিমোগ্লোবিন:
                            </strong>

                            ${hemoglobin}

                        </div>


                        <div class="row">

                            📅

                            <strong>
                                রক্তদানের তারিখ:
                            </strong>

                            ${date}

                        </div>


                        <div class="row">

                            🕒

                            <strong>
                                রক্তদানের সময়:
                            </strong>

                            ${time}

                        </div>


                        <div class="row">

                            🏥

                            <strong>
                                হাসপাতাল:
                            </strong>

                            ${hospital}

                        </div>


                        <div class="row">

                            📱

                            <strong>
                                যোগাযোগ:
                            </strong>

                            ${mobile}

                        </div>


                        <div
                            class="update ${updateClass}"
                        >

                            Update:
                            ${escapeHtml(status)}

                        </div>


                        ${
                            canChangeStatus
                            ?

                            `

                            <div class="status-control">

                                <select
                                    class="status-select"
                                    data-request-id="${requestId}"
                                >

                                    <option
                                        value="No Update"
                                        ${status === "No Update" ? "selected" : ""}
                                    >
                                        🔵 No Update
                                    </option>

                                    <option
                                        value="Pending"
                                        ${status === "Pending" ? "selected" : ""}
                                    >
                                        🟡 Pending
                                    </option>

                                    <option
                                        value="Managed"
                                        ${status === "Managed" ? "selected" : ""}
                                    >
                                        🟢 Managed
                                    </option>

                                    <option
                                        value="Request Cancelled"
                                        ${status === "Request Cancelled" ? "selected" : ""}
                                    >
                                        🔴 Request Cancelled
                                    </option>

                                </select>


                                <button
                                    class="status-save"
                                    data-request-id="${requestId}"
                                >

                                    Update Status

                                </button>

                            </div>

                            `

                            :

                            ""

                        }


                        <div class="button-row">

                            <a
                                class="call-button"
                                href="tel:${mobile}"
                            >

                                📞 কল করুন

                            </a>


                            <a
                                class="message-button"
                                href="conversation.html?requestId=${encodeURIComponent(item.requestId || "")}"
                            >

                                💬 মেসেজ করুন

                            </a>

                        </div>

                    `;


                    requestList.appendChild(
                        card
                    );


                }

            );


            // ==================================
            // STATUS BUTTON
            // ==================================

            document
                .querySelectorAll(
                    ".status-save"
                )
                .forEach(

                    function(button) {


                        button.addEventListener(

                            "click",

                            async function() {


                                if (!currentUser) {

                                    alert(
                                        "⚠️ আগে Login করুন।"
                                    );

                                    return;

                                }


                                const id =
                                    button.dataset.requestId;


                                const select =
                                    cardSelect(
                                        button,
                                        id
                                    );


                                if (!select) {

                                    return;

                                }


                                const newStatus =
                                    select.value;


                                button.disabled =
                                    true;


                                button.innerText =
                                    "⏳ আপডেট হচ্ছে...";


                                try {


                                    await update(

                                        ref(
                                            db,
                                            "bloodRequests/" +
                                            id
                                        ),

                                        {

                                            status:
                                                newStatus,

                                            updatedAt:
                                                Date.now(),

                                            updatedBy:
                                                currentUser.uid

                                        }

                                    );


                                    alert(
                                        "✅ Status আপডেট হয়েছে।"
                                    );


                                }

                                catch(error) {


                                    console.error(
                                        error
                                    );


                                    alert(
                                        "❌ Status আপডেট করা যায়নি।"
                                    );

                                }


                                finally {

                                    button.disabled =
                                        false;

                                    button.innerText =
                                        "Update Status";

                                }

                            }

                        );

                    }

                );

        },

        function(error) {

            console.error(
                "Firebase Database Error:",
                error
            );


            requestList.innerHTML = `

                <div class="error">

                    ❌ আবেদনগুলি লোড করা যাচ্ছে না।

                    <br><br>

                    Firebase Database Rules পরীক্ষা করুন।

                </div>

            `;

        }

    );

}



// ==========================================
// FIND STATUS SELECT
// ==========================================

function cardSelect(button, requestId) {

    const controls =
        button
            .closest(".card")
            .querySelector(
                ".status-select"
            );


    return controls || null;

}

</script></body></html>
