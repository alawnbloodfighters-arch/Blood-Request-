<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>পাবলিক চ্যাট</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

}

body {

    background: #eee9e2;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow: hidden;

}


/* =========================
   HEADER
========================= */

.chat-header {

    height: 82px;

    background: #087f73;

    color: white;

    display: flex;

    align-items: center;

    padding: 10px 15px;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 10;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.18);

}

.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 30px;

    padding:
        5px 10px 5px 0;

    cursor: pointer;

}

.header-info {

    overflow: hidden;

}

.header-title {

    font-size: 21px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.header-subtitle {

    font-size: 14px;

    margin-top: 3px;

    opacity: .9;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   CHAT AREA
========================= */

.chat-area {

    position: fixed;

    top: 82px;
    bottom: 75px;

    left: 0;
    right: 0;

    overflow-y: auto;

    padding:
        18px 14px 25px;

}

.message {

    max-width: 78%;

    margin-bottom: 12px;

    padding:
        12px 14px 9px;

    border-radius: 18px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.08);

    word-wrap: break-word;

}

.message.mine {

    margin-left: auto;

    background: #ffb2b2;

    color: #6d0000;

    border-bottom-right-radius: 5px;

}

.message.other {

    margin-right: auto;

    background: #ffffff;

    color: #222;

    border-bottom-left-radius: 5px;

}

.sender-name {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;

    color: #087f73;

}

.mine .sender-name {

    color: #b00000;

}

.message-text {

    font-size: 19px;

    line-height: 1.45;

    white-space: pre-wrap;

}

.message-time {

    text-align: right;

    margin-top: 5px;

    font-size: 12px;

    color: #777;

}

.mine .message-time {

    color: #8d3b3b;

}


/* =========================
   EMPTY
========================= */

.empty-chat {

    text-align: center;

    color: #777;

    font-size: 18px;

    padding: 30px 10px;

}

.login-message {

    text-align: center;

    padding: 40px 20px;

    font-size: 19px;

}


/* =========================
   INPUT
========================= */

.chat-input-area {

    position: fixed;

    bottom: 0;

    left: 0;
    right: 0;

    height: 75px;

    background: #ffffff;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 12px;

    border-top:
        1px solid #ddd;

    z-index: 10;

}

.message-input {

    flex: 1;

    min-width: 0;

    height: 55px;

    border:
        1px solid #ddd;

    border-radius: 28px;

    padding:
        0 18px;

    font-size: 18px;

    outline: none;

}

.message-input:focus {

    border-color:
        #087f73;

}

.send-button {

    width: 100px;

    height: 55px;

    border: none;

    border-radius: 28px;

    background: #087f73;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

.send-button:disabled {

    opacity: .6;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .chat-header {

        height: 72px;

    }

    .chat-area {

        top: 72px;
        bottom: 70px;

    }

    .chat-input-area {

        height: 70px;

    }

    .message {

        max-width: 84%;

    }

    .message-text {

        font-size: 18px;

    }

    .header-title {

        font-size: 19px;

    }

    .send-button {

        width: 82px;

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="chat-header">

    <button
        class="back-button"
        id="backButton"
        type="button"
    >

        ‹

    </button>


    <div class="header-info">

        <div
            class="header-title"
            id="chatTitle"
        >

            💬 পাবলিক চ্যাট

        </div>


        <div
            class="header-subtitle"
            id="chatSubtitle"
        >

            মেসেজ লোড হচ্ছে...

        </div>

    </div>

</div>



<!-- =========================
     CHAT
========================= -->

<div
    class="chat-area"
    id="chatArea"
>

    <div class="empty-chat">

        ⏳ মেসেজ লোড হচ্ছে...

    </div>

</div>



<!-- =========================
     INPUT
========================= -->

<div
    class="chat-input-area"
>

    <input
        type="text"
        class="message-input"
        id="messageInput"
        placeholder="মেসেজ লিখুন..."
        autocomplete="off"
        maxlength="1000"
    >


    <button
        class="send-button"
        id="sendButton"
        type="button"
    >

        Send

    </button>

</div>



<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    push,
    set

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// ELEMENTS
// ==========================================

const chatArea =
    document.getElementById(
        "chatArea"
    );


const chatTitle =
    document.getElementById(
        "chatTitle"
    );


const chatSubtitle =
    document.getElementById(
        "chatSubtitle"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );



// ==========================================
// GET REQUEST ID
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const requestId =
    params.get("requestId");



// ==========================================
// GLOBAL
// ==========================================

let currentUser = null;

let applicantUid = null;

let applicantName = "আবেদনকারী";

let messagesLoaded = false;

let messagesListenerStarted = false;

let requestListenerStarted = false;



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// TIME
// ==========================================

function formatTime(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleTimeString(

        "bn-BD",

        {

            hour: "numeric",

            minute: "2-digit"

        }

    );

}



// ==========================================
// CHAT PATH
// ==========================================

function getChatPath() {

    return (

        "publicChats/" +

        requestId +

        "/messages"

    );

}



// ==========================================
// REQUEST ID CHECK
// ==========================================

if (!requestId) {

    chatTitle.innerText =
        "❌ আবেদন পাওয়া যায়নি";


    chatSubtitle.innerText =
        "Request ID নেই";


    chatArea.innerHTML = `

        <div class="login-message">

            ❌ এই চ্যাটের Request ID পাওয়া যায়নি।

            <br><br>

            আবেদন তালিকা থেকে আবার
            "মেসেজ করুন" চাপুন।

        </div>

    `;


    sendButton.disabled =
        true;


    messageInput.disabled =
        true;

}



// ==========================================
// LOAD REQUEST INFORMATION
// ==========================================

function loadRequestInfo() {

    if (!requestId) {

        return;

    }


    if (requestListenerStarted) {

        return;

    }


    requestListenerStarted =
        true;


    const requestRef =
        ref(
            db,
            "bloodRequests/" +
            requestId
        );


    onValue(

        requestRef,

        function(snapshot) {

            const request =
                snapshot.val();


            if (!request) {

                chatTitle.innerText =
                    "❌ আবেদন পাওয়া যায়নি";


                chatSubtitle.innerText =
                    "এই আবেদনটি পাওয়া যাচ্ছে না";


                chatArea.innerHTML = `

                    <div class="login-message">

                        ❌ এই আবেদনটি পাওয়া যাচ্ছে না।

                    </div>

                `;


                sendButton.disabled =
                    true;


                messageInput.disabled =
                    true;


                return;

            }


            // ==================================
            // APPLICANT UID
            // ==================================

            applicantUid =
                String(
                    request.uid || ""
                );


            // ==================================
            // APPLICANT NAME
            // ==================================

            applicantName =
                request.requesterName ||
                "আবেদনকারী";


            // ==================================
            // HEADER
            // ==================================

            chatTitle.innerText =
                "💬 আবেদন চ্যাট";


            chatSubtitle.innerText =
                "শুধু Login করা user মেসেজ করতে পারবেন";


            // ==================================
            // AUTH অনুযায়ী INPUT
            // ==================================

            if (currentUser) {

                sendButton.disabled =
                    false;

                messageInput.disabled =
                    false;

                messageInput.placeholder =
                    "মেসেজ লিখুন...";

            }

            else {

                sendButton.disabled =
                    true;

                messageInput.disabled =
                    true;

                messageInput.placeholder =
                    "মেসেজ করতে Login করুন";

            }


            loadMessages();

        },


        function(error) {

            console.error(
                "Request Load Error:",
                error
            );


            chatArea.innerHTML = `

                <div class="login-message">

                    ❌ আবেদন তথ্য লোড করা যাচ্ছে না।

                    <br><br>

                    Firebase Database Rules পরীক্ষা করুন।

                </div>

            `;


            sendButton.disabled =
                true;


            messageInput.disabled =
                true;

        }

    );

}



// ==========================================
// LOAD MESSAGES
// ==========================================

function loadMessages() {

    if (
        !requestId ||
        !applicantUid
    ) {

        return;

    }


    if (messagesListenerStarted) {

        return;

    }


    messagesListenerStarted =
        true;


    const messagesRef =
        ref(
            db,
            getChatPath()
        );


    onValue(

        messagesRef,

        function(snapshot) {

            const data =
                snapshot.val();


            // ==================================
            // NO MESSAGE
            // ==================================

            if (!data) {

                chatArea.innerHTML = `

                    <div class="empty-chat">

                        💬 এখনো কোনো মেসেজ নেই।

                        <br><br>

                        Login করে এই আবেদনের প্রথম মেসেজটি
                        পাঠান।

                    </div>

                `;


                messagesLoaded =
                    true;


                return;

            }


            // ==================================
            // ARRAY
            // ==================================

            const messages =
                Object.values(data);


            // ==================================
            // OLD → NEW
            // ==================================

            messages.sort(

                function(a, b) {

                    return (

                        Number(
                            a.createdAt || 0
                        )

                        -

                        Number(
                            b.createdAt || 0
                        )

                    );

                }

            );


            chatArea.innerHTML =
                "";


            // ==================================
            // DISPLAY
            // ==================================

            messages.forEach(

                function(message) {


                    // ==================================
                    // APPLICANT MESSAGE
                    // ==================================

                    const isApplicant =

                        String(
                            message.uid || ""
                        ) ===

                        String(
                            applicantUid
                        );


                    const messageDiv =
                        document.createElement(
                            "div"
                        );


                    messageDiv.className =

                        "message " +

                        (
                            isApplicant
                            ?
                            "mine"
                            :
                            "other"
                        );


                    // ==================================
                    // NAME
                    // ==================================

                    const senderName =

                        isApplicant

                        ?

                        applicantName

                        :

                        (
                            message.senderName ||
                            "ব্যবহারকারী"
                        );


                    const safeSenderName =
                        escapeHtml(
                            senderName
                        );


                    // ==================================
                    // TEXT
                    // ==================================

                    const messageText =
                        escapeHtml(
                            message.text || ""
                        );


                    // ==================================
                    // TIME
                    // ==================================

                    const time =
                        formatTime(
                            message.createdAt
                        );


                    messageDiv.innerHTML = `

                        <div class="sender-name">

                            ${safeSenderName}

                        </div>


                        <div class="message-text">

                            ${messageText}

                        </div>


                        <div class="message-time">

                            ${time}

                        </div>

                    `;


                    chatArea.appendChild(
                        messageDiv
                    );

                }

            );


            // ==================================
            // AUTO SCROLL
            // ==================================

            chatArea.scrollTop =
                chatArea.scrollHeight;


            messagesLoaded =
                true;

        },


        function(error) {

            console.error(
                "Chat Load Error:",
                error
            );


            chatArea.innerHTML = `

                <div class="login-message">

                    ❌ মেসেজ লোড করা যাচ্ছে না।

                    <br><br>

                    Firebase Database Rules পরীক্ষা করুন।

                </div>

            `;

        }

    );

}



// ==========================================
// SEND MESSAGE
// ==========================================

async function sendMessage() {


    // ==================================
    // LOGIN CHECK
    // ==================================

    if (!currentUser) {

        alert(
            "⚠️ মেসেজ পাঠাতে আগে Login করুন।"
        );

        return;

    }


    // ==================================
    // REQUEST ID CHECK
    // ==================================

    if (!requestId) {

        alert(
            "❌ Request ID পাওয়া যায়নি।"
        );

        return;

    }


    // ==================================
    // APPLICANT CHECK
    // ==================================

    if (!applicantUid) {

        alert(
            "⏳ আবেদন তথ্য এখনো লোড হয়নি।"
        );

        return;

    }


    // ==================================
    // TEXT
    // ==================================

    const text =
        messageInput.value.trim();


    if (!text) {

        return;

    }


    sendButton.disabled =
        true;


    sendButton.innerText =
        "⏳";


    try {


        // ==================================
        // CHAT
        // ==================================

        const messagesRef =
            ref(
                db,
                getChatPath()
            );


        // ==================================
        // MESSAGE ID
        // ==================================

        const messageRef =
            push(
                messagesRef
            );


        // ==================================
        // SENDER UID
        // ==================================

        const senderUid =
            currentUser.uid;


        // ==================================
        // SENDER NAME
        // ==================================

        const senderName =

            currentUser.displayName ||

            currentUser.email ||

            "ব্যবহারকারী";


        // ==================================
        // MESSAGE DATA
        // ==================================

        const messageData = {

            uid:
                senderUid,

            senderName:
                senderName,

            text:
                text,

            createdAt:
                Date.now()

        };


        // ==================================
        // SAVE
        // ==================================

        await set(

            messageRef,

            messageData

        );


        // ==================================
        // CLEAR
        // ==================================

        messageInput.value =
            "";

    }


    catch(error) {

        console.error(
            "Send Message Error:",
            error
        );


        alert(

            "❌ মেসেজ পাঠানো যায়নি।\n\n" +

            (
                error.message ||
                "Firebase Rules পরীক্ষা করুন।"
            )

        );

    }


    finally {

        sendButton.disabled =
            !currentUser;


        sendButton.innerText =
            "Send";


        if (currentUser) {

            messageInput.focus();

        }

    }

}



// ==========================================
// SEND BUTTON
// ==========================================

sendButton.addEventListener(

    "click",

    sendMessage

);



// ==========================================
// ENTER
// ==========================================

messageInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);



// ==========================================
// BACK
// ==========================================

backButton.addEventListener(

    "click",

    function() {

        history.back();

    }

);



// ==========================================
// AUTH STATE
// ==========================================

onAuthStateChanged(

    auth,

    function(user) {

        currentUser =
            user;


        if (!requestId) {

            return;

        }


        // ==================================
        // LOGIN USER
        // ==================================

        if (user) {

            if (applicantUid) {

                sendButton.disabled =
                    false;

                messageInput.disabled =
                    false;

                messageInput.placeholder =
                    "মেসেজ লিখুন...";

            }

        }


        // ==================================
        // NOT LOGIN
        // ==================================

        else {

            sendButton.disabled =
                true;

            messageInput.disabled =
                true;

            messageInput.placeholder =
                "মেসেজ করতে Login করুন";

        }


        loadRequestInfo();

    }

);


// ==========================================
// START
// ==========================================

if (requestId) {

    loadRequestInfo();

}

</script>


</body>

</html>
