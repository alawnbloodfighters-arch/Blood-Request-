<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>পাবলিক চ্যাট</title>


<!-- বাংলা Font -->
<link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

}

body {

    background: #eee9e2;

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    overflow: hidden;

}


/* =========================
   HEADER
========================= */

.chat-header {

    height: 82px;

    background: #087f73;

    color: white;

    display: flex;

    align-items: center;

    padding: 10px 15px;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 10;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.18);

}

.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 30px;

    padding:
        5px 10px 5px 0;

    cursor: pointer;

}

.header-info {

    overflow: hidden;

}

.header-title {

    font-size: 21px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.header-subtitle {

    font-size: 14px;

    margin-top: 3px;

    opacity: .9;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   CHAT AREA
========================= */

.chat-area {

    position: fixed;

    top: 82px;
    bottom: 75px;

    left: 0;
    right: 0;

    overflow-y: auto;

    padding:
        18px 14px 25px;

}


/* =========================
   MESSAGE
========================= */

.message {

    max-width: 78%;

    margin-bottom: 12px;

    padding:
        12px 14px 10px;

    border-radius: 18px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.08);

    word-wrap: break-word;

    overflow-wrap: break-word;

}


/* =========================
   APPLICANT
   RIGHT + RED
========================= */

.message.mine {

    margin-left: auto;

    margin-right: 0;

    background: #ffb2b2;

    color: #6d0000;

    border-bottom-right-radius: 5px;

}


/* =========================
   OTHER USER
   LEFT + WHITE
========================= */

.message.other {

    margin-left: 0;

    margin-right: auto;

    background: #ffffff;

    color: #222;

    border-bottom-left-radius: 5px;

}


/* =========================
   SENDER NAME
========================= */

.sender-name {

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 5px;

    color: #087f73;

    line-height: 1.4;

}

.mine .sender-name {

    color: #b00000;

}


/* =========================
   MESSAGE TEXT
========================= */

.message-text {

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 19px;

    font-weight: 400;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: normal;

    overflow-wrap: break-word;

    text-align: left;

}


/* =========================
   MESSAGE TIME
========================= */

.message-time {

    text-align: right;

    margin-top: 5px;

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 12px;

    color: #777;

    line-height: 1.3;

}

.mine .message-time {

    color: #8d3b3b;

}


/* =========================
   EMPTY
========================= */

.empty-chat {

    text-align: center;

    color: #777;

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 18px;

    line-height: 1.6;

    padding: 30px 10px;

}

.login-message {

    text-align: center;

    padding: 40px 20px;

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 19px;

    line-height: 1.7;

}


/* =========================
   INPUT
========================= */

.chat-input-area {

    position: fixed;

    bottom: 0;

    left: 0;
    right: 0;

    height: 75px;

    background: #ffffff;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 12px;

    border-top:
        1px solid #ddd;

    z-index: 10;

}

.message-input {

    flex: 1;

    min-width: 0;

    height: 55px;

    border:
        1px solid #ddd;

    border-radius: 28px;

    padding:
        0 18px;

    font-family:
        "Noto Sans Bengali",
        Arial,
        sans-serif;

    font-size: 18px;

    outline: none;

}

.message-input:focus {

    border-color:
        #087f73;

}

.send-button {

    width: 100px;

    height: 55px;

    border: none;

    border-radius: 28px;

    background: #087f73;

    color: white;

    font-family:
        Arial,
        sans-serif;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}

.send-button:disabled {

    opacity: .6;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .chat-header {

        height: 72px;

    }

    .chat-area {

        top: 72px;
        bottom: 70px;

    }

    .chat-input-area {

        height: 70px;

    }

    .message {

        max-width: 84%;

    }

    .message-text {

        font-size: 18px;

        line-height: 1.55;

    }

    .header-title {

        font-size: 19px;

    }

    .header-subtitle {

        font-size: 14px;

    }

    .send-button {

        width: 82px;

        font-size: 17px;

    }

}

</style>

</head>


<body>

     HEADER
========================= -->

<div class="chat-header">

    <button

    >

    </button>


    <div class="header-info">

        class="message-input"

        maxlength="1000"
    >


    <button
        class="send-button"
        id="sendButton"
        type="button"
    >

        Send

    </button>

</div>

// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// CLEAN MESSAGE TEXT
// ==========================================

function cleanMessageText(value) {

    return String(value ?? "")

        .replace(/\r\n/g, "\n")

        .replace(/[ \t]+/g, " ")

        .split("\n")

        .map(function(line) {

            return line.trim();

        })

        .filter(function(line) {

            return line.length > 0;

        })

        .join("\n")

        .trim();

}
