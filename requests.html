<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>শেষের আবেদনগুলি</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    padding: 15px 10px;

    background: #f5f5f5;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    color: #222;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-text-size-adjust: 100%;

    text-size-adjust: 100%;
}

.container {

    max-width: 700px;

    margin: auto;
}

.title {

    text-align: center;

    font-size: 28px;

    font-weight: bold;

    margin: 8px 0 20px;
}

.title span {

    color: #d00000;
}

.card {

    background: #ffffff;

    border-radius: 18px;

    margin-bottom: 14px;

    padding: 16px 16px 14px 20px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

    border-left: 6px solid #d00000;
}

.blood-group {

    font-size: 30px;

    font-weight: bold;

    color: #c80000;

    margin-bottom: 13px;
}

.row {

    font-size: 18px;

    margin: 7px 0;

    line-height: 1.4;
}

.row strong {

    font-weight: bold;
}


/* =========================
   UPDATE
========================= */

.update {

    margin-top: 13px;

    padding: 9px 12px;

    border-radius: 9px;

    font-size: 17px;

    font-weight: bold;

    border-left: 5px solid;
}

.update.green {

    background: #e7f8ec;

    color: #138a3d;

    border-color: #19a34a;
}

.update.yellow {

    background: #fff7d6;

    color: #9a7600;

    border-color: #e0b800;
}

.update.red {

    background: #ffe6e6;

    color: #c00000;

    border-color: #d00000;
}

.update.blue {

    background: #e9f2ff;

    color: #1769aa;

    border-color: #287bdc;
}


/* =========================
   STATUS CONTROL
========================= */

.status-control {

    margin-top: 7px;
}

.status-select {

    width: 100%;

    padding: 8px;

    border-radius: 8px;

    border: 1px solid #ccc;

    font-size: 16px;

    background: white;
}

.status-save {

    width: 100%;

    margin-top: 6px;

    padding: 8px;

    border: none;

    border-radius: 8px;

    background: #333;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.status-save:active {

    transform: scale(0.98);
}


/* =========================
   BUTTONS
========================= */

.button-row {

    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.call-button,
.message-button {

    flex: 1;

    display: block;

    text-align: center;

    text-decoration: none;

    color: white;

    font-size: 17px;

    font-weight: bold;

    padding: 10px 6px;

    border-radius: 9px;

    border: none;
}

.call-button {

    background: #168a3b;
}

.message-button {

    background: #087f73;

    position: relative;
}

.call-button:active,
.message-button:active {

    transform: scale(0.98);
}


/* =========================
   UNREAD BADGE
========================= */

.unread-badge {

    position: absolute;

    top: -8px;

    right: -5px;

    min-width: 23px;

    height: 23px;

    padding: 0 6px;

    border-radius: 50px;

    background: #d00000;

    color: white;

    font-size: 12px;

    font-weight: bold;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 2px solid white;

    line-height: 1;
}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    font-size: 20px;

    padding: 25px;
}


/* =========================
   ERROR
========================= */

.error {

    text-align: center;

    color: #d00000;

    font-size: 19px;

    padding: 20px;

    word-break: break-word;
}

.error-details {

    margin-top: 12px;

    padding: 10px;

    background: #fff;

    border: 1px solid #f0b0b0;

    border-radius: 9px;

    text-align: left;

    font-size: 14px;

    line-height: 1.5;

    color: #8b0000;

    word-break: break-word;
}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    font-size: 20px;

    padding: 25px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

        padding: 10px 7px;
    }

    .title {

        font-size: 25px;

        margin: 7px 0 17px;
    }

    .card {

        padding: 14px 12px 12px 16px;

        border-radius: 17px;

        margin-bottom: 12px;

        border-left-width: 6px;
    }

    .blood-group {

        font-size: 28px;

        margin-bottom: 11px;
    }

    .row {

        font-size: 16px;

        margin: 6px 0;

        line-height: 1.35;
    }

    .update {

        font-size: 16px;

        margin-top: 12px;

        padding: 8px 10px;
    }

    .button-row {

        gap: 7px;

        margin-top: 10px;
    }

    .call-button,
    .message-button {

        font-size: 16px;

        padding: 9px 4px;
    }

    .error {

        font-size: 17px;
    }
}


@media (max-width: 380px) {

    .title {

        font-size: 23px;
    }

    .card {

        padding: 13px 11px 11px 15px;
    }

    .blood-group {

        font-size: 27px;

        margin-bottom: 10px;
    }

    .row {

        font-size: 15px;

        margin: 5px 0;
    }

    .update {

        font-size: 15px;

        padding: 7px 9px;
    }

    .call-button,
    .message-button {

        font-size: 15px;

        padding: 8px 3px;
    }
}


::-webkit-scrollbar {

    width: 6px;
}

::-webkit-scrollbar-track {

    background: #f5f5f5;
}

::-webkit-scrollbar-thumb {

    background: #c9141b;

    border-radius: 10px;
}

</style>

</head>


<body>


<div class="container">

    <div class="title">

        🩸

        <span>
            শেষের আবেদনগুলি
        </span>

    </div>


    <div id="requestList">

        <div class="loading">

            ⏳ আবেদনগুলি লোড হচ্ছে...

        </div>

    </div>

</div>



<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    update

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// ELEMENT
// ==========================================

const requestList =
    document.getElementById(
        "requestList"
    );



// ==========================================
// GLOBAL
// ==========================================

let currentUser = null;

let isAdmin = false;

let authReady = false;

let requestsListenerStarted = false;



// ==========================================
// CALL NUMBER TO APP INVENTOR
// ==========================================

function callNumber(number) {

    if (

        window.AppInventor &&

        typeof window.AppInventor.setWebViewString ===
        "function"

    ) {

        window.AppInventor.setWebViewString(

            "CALL_NUMBER:" + number

        );

    }

    else {

        alert(
            "App Inventor connection পাওয়া যাচ্ছে না।"
        );

    }

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



// ==========================================
// DATE
// ==========================================

function formatDate(value) {

    if (!value) {

        return "";
    }


    const dateString =
        String(value).trim();


    const match =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        return (

            match[3] +
            "/" +
            match[2] +
            "/" +
            match[1]

        );

    }


    return dateString;

}



// ==========================================
// STATUS COLOR
// ==========================================

function getUpdateClass(status) {

    const text =

        String(
            status || ""
        )

        .trim()

        .toLowerCase();


    if (text === "managed") {

        return "green";

    }


    if (text === "pending") {

        return "yellow";

    }


    if (text === "request cancelled") {

        return "red";

    }


    return "blue";

}



// ==========================================
// UNREAD MESSAGE COUNT
// ==========================================

function loadUnreadCount(

    requestId,

    currentUserId,

    badgeElement

) {

    if (

        !requestId ||

        !currentUserId ||

        !badgeElement

    ) {

        return;

    }


    const chatRef =

        ref(

            db,

            "publicChats/" +
            requestId

        );


    onValue(

        chatRef,

        function(snapshot) {

            const chatData =
                snapshot.val();


            if (!chatData) {

                badgeElement.style.display =
                    "none";

                return;

            }


            const messages =
                chatData.messages || {};


            const readState =
                chatData.readState || {};


            const userReadData =
                readState[currentUserId] || {};


            const lastReadAt =
                Number(
                    userReadData.lastReadAt || 0
                );


            let unreadCount = 0;


            Object.values(messages).forEach(

                function(message) {

                    if (!message) {

                        return;

                    }


                    const messageTime =
                        Number(
                            message.createdAt || 0
                        );


                    const senderUid =
                        String(
                            message.uid || ""
                        );


                    if (

                        senderUid !==
                        String(currentUserId)

                        &&

                        messageTime >
                        lastReadAt

                    ) {

                        unreadCount++;

                    }

                }

            );


            if (unreadCount > 0) {

                badgeElement.style.display =
                    "flex";

                badgeElement.innerText =
                    unreadCount > 99
                    ?
                    "99+"
                    :
                    String(unreadCount);

            }

            else {

                badgeElement.style.display =
                    "none";

                badgeElement.innerText =
                    "0";

            }

        },

        function(error) {

            console.error(
                "Unread Count Error:",
                error
            );

        }

    );

}



// ==========================================
// REFRESH BADGES
// ==========================================

function refreshUnreadBadges() {

    if (!currentUser) {

        return;

    }


    const messageButtons =

        document.querySelectorAll(
            ".message-button"
        );


    messageButtons.forEach(

        function(messageButton) {

            const href =
                messageButton.getAttribute(
                    "href"
                );


            if (!href) {

                return;

            }


            let actualRequestId = "";


            try {

                const url =
                    new URL(
                        href,
                        window.location.href
                    );


                actualRequestId =

                    url.searchParams.get(
                        "requestId"
                    ) || "";

            }

            catch(error) {

                console.error(
                    "Badge URL Error:",
                    error
                );

                return;

            }


            if (!actualRequestId) {

                return;

            }


            const badgeElement =

                messageButton.querySelector(
                    ".unread-badge"
                );


            if (!badgeElement) {

                return;

            }


            loadUnreadCount(

                actualRequestId,

                currentUser.uid,

                badgeElement

            );

        }

    );

}



// ==========================================
// PAGE SHOW
// ==========================================

window.addEventListener(

    "pageshow",

    function() {

        setTimeout(

            function() {

                refreshUnreadBadges();

            },

            100

        );

    }

);



// ==========================================
// VISIBILITY CHANGE
// ==========================================

document.addEventListener(

    "visibilitychange",

    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            setTimeout(

                function() {

                    refreshUnreadBadges();

                },

                100

            );

        }

    }

);



// ==========================================
// AUTH
// ==========================================

onAuthStateChanged(

    auth,

    async function(user) {

        currentUser =
            user;


        isAdmin =
            false;


        authReady =
            true;


        if (user) {

            try {

                const userRef =
                    ref(
                        db,
                        "users/" +
                        user.uid
                    );


                const userSnapshot =

                    await new Promise(

                        function(resolve, reject) {

                            onValue(

                                userRef,

                                resolve,

                                {
                                    onlyOnce:
                                        true
                                }

                            );

                        }

                    );


                const userData =
                    userSnapshot.val();


                if (

                    userData &&

                    userData.role ===
                    "admin"

                ) {

                    isAdmin =
                        true;

                }

            }

            catch(error) {

                console.error(
                    "Admin check error:",
                    error
                );

            }

        }


        loadRequests();

    }

);



// ==========================================
// LOAD REQUESTS
// ==========================================

function loadRequests() {

    if (!authReady) {

        return;

    }


    if (requestsListenerStarted) {

        return;

    }


    requestsListenerStarted =
        true;


    const requestsRef =
        ref(
            db,
            "bloodRequests"
        );


    onValue(

        requestsRef,

        function(snapshot) {

            const value =
                snapshot.val();


            if (!value) {

                requestList.innerHTML = `

                    <div class="empty">

                        📭 এখন কোনো রক্তের আবেদন নেই।

                    </div>

                `;

                return;

            }


            const requests =
                Object.entries(value);


            requests.sort(

                function(a, b) {

                    const itemA =
                        a[1] || {};


                    const itemB =
                        b[1] || {};


                    return (

                        Number(
                            itemB.createdAt || 0
                        )

                        -

                        Number(
                            itemA.createdAt || 0
                        )

                    );

                }

            );


            requestList.innerHTML =
                "";


            requests.forEach(

                function(entry) {

                    const databaseRequestId =
                        entry[0];


                    const item =
                        entry[1] || {};


                    const actualRequestId =
                        String(
                            databaseRequestId
                        );


                    const bloodGroup =
                        escapeHtml(
                            item.bloodGroup
                        );


                    const reference =
                        escapeHtml(
                            item.reference
                        );


                    const problem =
                        escapeHtml(
                            item.problem
                        );


                    const hemoglobin =
                        escapeHtml(
                            item.hemoglobin
                        );


                    const date =
                        escapeHtml(
                            formatDate(item.date)
                        );


                    const time =
                        escapeHtml(
                            item.time
                        );


                    const hospital =
                        escapeHtml(
                            item.hospital
                        );


                    const mobile =
                        escapeHtml(
                            item.mobile
                        );


                    const status =
                        String(
                            item.status ||
                            "No Update"
                        );


                    const updateClass =
                        getUpdateClass(
                            status
                        );


                    const canChangeStatus =

                        currentUser &&

                        (

                            isAdmin ||

                            currentUser.uid ===
                            item.uid

                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    card.innerHTML = `

                        <div class="blood-group">

                            🩸 ${bloodGroup}

                        </div>


                        <div class="row">

                            👤

                            <strong>
                                রেফারেন্স:
                            </strong>

                            ${reference}

                        </div>


                        <div class="row">

                            🩺

                            <strong>
                                রোগীর সমস্যা:
                            </strong>

                            ${problem}

                        </div>


                        <div class="row">

                            🧪

                            <strong>
                                হিমোগ্লোবিন:
                            </strong>

                            ${hemoglobin}

                        </div>


                        <div class="row">

                            📅

                            <strong>
                                রক্তদানের তারিখ:
                            </strong>

                            ${date}

                        </div>


                        <div class="row">

                            🕒

                            <strong>
                                রক্তদানের সময়:
                            </strong>

                            ${time}

                        </div>


                        <div class="row">

                            🏥

                            <strong>
                                হাসপাতাল:
                            </strong>

                            ${hospital}

                        </div>


                        <div class="row">

                            📱

                            <strong>
                                যোগাযোগ:
                            </strong>

                            ${mobile}

                        </div>


                        <div class="update ${updateClass}">

                            Update:

                            ${escapeHtml(status)}

                        </div>


                        ${
                            canChangeStatus
                            ?

                            `

                            <div class="status-control">

                                <select
                                    class="status-select"
                                >

                                    <option
                                        value="No Update"
                                        ${
                                            status ===
                                            "No Update"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >
                                        🔵 No Update
                                    </option>


                                    <option
                                        value="Pending"
                                        ${
                                            status ===
                                            "Pending"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >
                                        🟡 Pending
                                    </option>


                                    <option
                                        value="Managed"
                                        ${
                                            status ===
                                            "Managed"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >
                                        🟢 Managed
                                    </option>


                                    <option
                                        value="Request Cancelled"
                                        ${
                                            status ===
                                            "Request Cancelled"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >
                                        🔴 Request Cancelled
                                    </option>

                                </select>


                                <button
                                    class="status-save"
                                    type="button"
                                >
                                    Update Status
                                </button>

                            </div>

                            `

                            :

                            ""

                        }


                        <div class="button-row">

                            <button
                                class="call-button"
                                type="button"
                                onclick="callNumber('${mobile}')"
                            >
                                📞 কল করুন
                            </button>


                            <a
                                class="message-button"
                                href="conversation.html?requestId=${encodeURIComponent(
                                    actualRequestId
                                )}"
                            >

                                💬 মেসেজ করুন

                                <span
                                    class="unread-badge"
                                    style="display:none"
                                >
                                    0
                                </span>

                            </a>

                        </div>

                    `;


                    // ==================================
                    // UNREAD BADGE
                    // ==================================

                    if (currentUser) {

                        const unreadBadge =
                            card.querySelector(
                                ".unread-badge"
                            );


                        loadUnreadCount(

                            actualRequestId,

                            currentUser.uid,

                            unreadBadge

                        );

                    }


                    // ==================================
                    // STATUS
                    // ==================================

                    const statusButton =
                        card.querySelector(
                            ".status-save"
                        );


                    if (statusButton) {

                        statusButton.addEventListener(

                            "click",

                            async function() {

                                if (!currentUser) {

                                    alert(
                                        "⚠️ Status পরিবর্তন করতে আগে Login করুন।"
                                    );

                                    return;

                                }


                                const select =
                                    card.querySelector(
                                        ".status-select"
                                    );


                                if (!select) {

                                    return;

                                }


                                const newStatus =
                                    select.value;


                                statusButton.disabled =
                                    true;


                                statusButton.innerText =
                                    "⏳ আপডেট হচ্ছে...";


                                try {

                                    await update(

                                        ref(
                                            db,
                                            "bloodRequests/" +
                                            actualRequestId
                                        ),

                                        {

                                            status:
                                                newStatus,

                                            updatedAt:
                                                Date.now(),

                                            updatedBy:
                                                currentUser.uid

                                        }

                                    );


                                    alert(
                                        "✅ Status আপডেট হয়েছে।"
                                    );

                                }

                                catch(error) {

                                    console.error(
                                        "Status Update Error:",
                                        error
                                    );


                                    alert(

                                        "❌ Status আপডেট করা যায়নি।\n\n" +

                                        (
                                            error &&
                                            error.message
                                            ?
                                            error.message
                                            :
                                            "Firebase Error"
                                        )

                                    );

                                }

                                finally {

                                    statusButton.disabled =
                                        false;

                                    statusButton.innerText =
                                        "Update Status";

                                }

                            }

                        );

                    }


                    requestList.appendChild(
                        card
                    );

                }

            );


            setTimeout(

                function() {

                    refreshUnreadBadges();

                },

                100

            );

        },


        function(error) {

            console.error(
                "Firebase Database Error:",
                error
            );


            const errorCode =

                error &&
                error.code
                ?
                error.code
                :
                "unknown";


            const errorMessage =

                error &&
                error.message
                ?
                error.message
                :
                "Unknown Firebase Error";


            requestList.innerHTML = `

                <div class="error">

                    ❌ আবেদনগুলি লোড করা যাচ্ছে না।

                    <br><br>

                    <strong>
                        Firebase Database Error
                    </strong>


                    <div class="error-details">

                        <strong>
                            Error Code:
                        </strong>

                        <br>

                        ${escapeHtml(errorCode)}

                        <br><br>

                        <strong>
                            Error Message:
                        </strong>

                        <br>

                        ${escapeHtml(errorMessage)}

                    </div>

                </div>

            `;

        }

    );

}

</script>

</body>

</html>
