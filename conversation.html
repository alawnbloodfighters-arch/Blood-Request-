<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>পাবলিক চ্যাট</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

}


body {

    background: #eee9e2;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow: hidden;

}


/* =========================
   HEADER
========================= */

.chat-header {

    height: 82px;

    background: #087f73;

    color: white;

    display: flex;

    align-items: center;

    padding:
        10px 15px;

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    z-index: 10;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.18);

}


.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 30px;

    padding:
        5px 10px 5px 0;

    cursor: pointer;

}


.header-info {

    overflow: hidden;

}


.header-title {

    font-size: 22px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.header-subtitle {

    font-size: 14px;

    margin-top: 3px;

    opacity: .9;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   CHAT AREA
========================= */

.chat-area {

    position: fixed;

    top: 82px;

    bottom: 75px;

    left: 0;

    right: 0;

    overflow-y: auto;

    padding:
        18px 14px 25px;

}


.message {

    max-width: 78%;

    margin-bottom: 12px;

    padding:
        12px 14px 9px;

    border-radius: 18px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.08);

    word-wrap: break-word;

}


.message.mine {

    margin-left: auto;

    background: #ffb2b2;

    color: #6d0000;

    border-bottom-right-radius: 5px;

}


.message.other {

    margin-right: auto;

    background: #ffffff;

    color: #222;

    border-bottom-left-radius: 5px;

}


.sender-name {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;

    color: #087f73;

}


.mine .sender-name {

    color: #b00000;

}


.message-text {

    font-size: 19px;

    line-height: 1.45;

    white-space: pre-wrap;

}


.message-time {

    text-align: right;

    margin-top: 5px;

    font-size: 12px;

    color: #777;

}


.mine .message-time {

    color: #8d3b3b;

}


/* =========================
   EMPTY
========================= */

.empty-chat {

    text-align: center;

    color: #777;

    font-size: 18px;

    padding: 30px 10px;

}


/* =========================
   INPUT
========================= */

.chat-input-area {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 75px;

    background: #ffffff;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 12px;

    border-top:
        1px solid #ddd;

    z-index: 10;

}


.message-input {

    flex: 1;

    height: 55px;

    border:
        1px solid #ddd;

    border-radius: 28px;

    padding:
        0 18px;

    font-size: 18px;

    outline: none;

}


.message-input:focus {

    border-color:
        #087f73;

}


.send-button {

    width: 100px;

    height: 55px;

    border: none;

    border-radius: 28px;

    background: #087f73;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.send-button:disabled {

    opacity: .6;

}


/* =========================
   LOGIN
========================= */

.login-message {

    text-align: center;

    padding: 40px 20px;

    font-size: 19px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .chat-header {

        height: 72px;

    }


    .chat-area {

        top: 72px;

        bottom: 70px;

    }


    .chat-input-area {

        height: 70px;

    }


    .message {

        max-width: 84%;

    }


    .message-text {

        font-size: 18px;

    }


    .header-title {

        font-size: 19px;

    }


    .send-button {

        width: 82px;

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="chat-header">


    <button
        class="back-button"
        id="backButton"
        type="button"
    >

        ‹

    </button>


    <div class="header-info">

        <div
            class="header-title"
            id="chatTitle"
        >

            💬 পাবলিক চ্যাট

        </div>


        <div
            class="header-subtitle"
            id="chatSubtitle"
        >

            সবার সাথে কথা বলুন

        </div>

    </div>

</div>



<!-- =========================
     CHAT
========================= -->

<div
    class="chat-area"
    id="chatArea"
>

    <div class="empty-chat">

        ⏳ মেসেজ লোড হচ্ছে...

    </div>

</div>



<!-- =========================
     INPUT
========================= -->

<div
    class="chat-input-area"
    id="inputArea"
>

    <input
        type="text"
        class="message-input"
        id="messageInput"
        placeholder="মেসেজ লিখুন..."
        autocomplete="off"
        maxlength="1000"
    >


    <button
        class="send-button"
        id="sendButton"
        type="button"
    >

        Send

    </button>

</div>



<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    push,
    set

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// PUBLIC CHAT PATH
// ==========================================

const PUBLIC_CHAT_PATH =
    "publicChat/messages";



// ==========================================
// ELEMENTS
// ==========================================

const chatArea =
    document.getElementById(
        "chatArea"
    );


const chatTitle =
    document.getElementById(
        "chatTitle"
    );


const chatSubtitle =
    document.getElementById(
        "chatSubtitle"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );



// ==========================================
// CURRENT USER
// ==========================================

let currentUser = null;



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// TIME FORMAT
// ==========================================

function formatTime(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleTimeString(

        "bn-BD",

        {

            hour:
                "numeric",

            minute:
                "2-digit"

        }

    );

}



// ==========================================
// AUTH
// ==========================================

onAuthStateChanged(

    auth,

    function(user) {


        currentUser =
            user;


        if (!user) {


            chatArea.innerHTML = `

                <div class="login-message">

                    ⚠️ পাবলিক চ্যাটে প্রবেশ করতে
                    Login করতে হবে।

                    <br><br>

                    Login করার পর আবার
                    "মেসেজ করুন" চাপুন।

                </div>

            `;


            sendButton.disabled =
                true;


            messageInput.disabled =
                true;


            chatSubtitle.innerText =
                "Login প্রয়োজন";


            return;

        }



        // ==================================
        // LOGIN OK
        // ==================================

        sendButton.disabled =
            false;


        messageInput.disabled =
            false;


        chatTitle.innerText =
            "💬 পাবলিক চ্যাট";


        chatSubtitle.innerText =
            "সবাই সবার সাথে কথা বলতে পারবেন";


        loadMessages();

    }

);



// ==========================================
// LOAD PUBLIC MESSAGES
// ==========================================

function loadMessages() {


    onValue(

        ref(
            db,
            PUBLIC_CHAT_PATH
        ),

        function(snapshot) {


            const data =
                snapshot.val();


            if (!data) {

                chatArea.innerHTML = `

                    <div class="empty-chat">

                        💬 এখনো কোনো মেসেজ নেই।

                        <br><br>

                        প্রথম মেসেজটি আপনিই পাঠান।

                    </div>

                `;

                return;

            }



            // ==================================
            // OBJECT → ARRAY
            // ==================================

            const messages =
                Object.values(data);



            // ==================================
            // OLD → NEW
            // ==================================

            messages.sort(

                function(a, b) {

                    return (

                        Number(
                            a.createdAt || 0
                        )

                        -

                        Number(
                            b.createdAt || 0
                        )

                    );

                }

            );



            chatArea.innerHTML = "";



            // ==================================
            // SHOW MESSAGES
            // ==================================

            messages.forEach(

                function(message) {


                    const isMine =

                        currentUser &&

                        message.uid ===
                        currentUser.uid;



                    const messageDiv =
                        document.createElement(
                            "div"
                        );


                    messageDiv.className =

                        "message " +

                        (
                            isMine
                            ?
                            "mine"
                            :
                            "other"
                        );



                    const senderName =
                        escapeHtml(

                            message.senderName ||

                            "ব্যবহারকারী"

                        );



                    const messageText =
                        escapeHtml(

                            message.text

                        );



                    const time =
                        formatTime(

                            message.createdAt

                        );



                    messageDiv.innerHTML = `

                        <div class="sender-name">

                            ${senderName}

                        </div>


                        <div class="message-text">

                            ${messageText}

                        </div>


                        <div class="message-time">

                            ${time}

                            ${
                                isMine
                                ?
                                " ✓✓"
                                :
                                ""
                            }

                        </div>

                    `;



                    chatArea.appendChild(
                        messageDiv
                    );

                }

            );



            // ==================================
            // AUTO SCROLL
            // ==================================

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },


        function(error) {


            console.error(

                "Public Chat Error:",

                error

            );


            chatArea.innerHTML = `

                <div class="login-message">

                    ❌ মেসেজ লোড করা যাচ্ছে না।

                    <br><br>

                    Firebase Rules পরীক্ষা করুন।

                </div>

            `;

        }

    );

}



// ==========================================
// SEND MESSAGE
// ==========================================

async function sendMessage() {


    if (!currentUser) {

        alert(
            "⚠️ আগে Login করুন।"
        );

        return;

    }



    const text =
        messageInput.value.trim();



    if (!text) {

        return;

    }



    sendButton.disabled =
        true;


    sendButton.innerText =
        "⏳";



    try {


        // ==================================
        // PUBLIC MESSAGE PATH
        // ==================================

        const messagesRef =
            ref(

                db,

                PUBLIC_CHAT_PATH

            );



        // ==================================
        // NEW MESSAGE
        // ==================================

        const messageRef =
            push(
                messagesRef
            );



        // ==================================
        // USER NAME
        // ==================================

        const senderName =

            currentUser.displayName ||

            currentUser.email ||

            "ব্যবহারকারী";



        // ==================================
        // MESSAGE DATA
        // ==================================

        const messageData = {

            uid:

                currentUser.uid,


            senderName:

                senderName,


            senderEmail:

                currentUser.email || "",


            text:

                text,


            createdAt:

                Date.now()

        };



        // ==================================
        // SAVE
        // ==================================

        await set(

            messageRef,

            messageData

        );



        // ==================================
        // CLEAR INPUT
        // ==================================

        messageInput.value = "";


    }

    catch(error) {


        console.error(

            "Send Message Error:",

            error

        );


        alert(

            "❌ মেসেজ পাঠানো যায়নি।\n\n" +

            "Firebase Database Rules অথবা Internet সংযোগ পরীক্ষা করুন।"

        );

    }


    finally {


        sendButton.disabled =
            false;


        sendButton.innerText =
            "Send";


        messageInput.focus();

    }

}



// ==========================================
// SEND BUTTON
// ==========================================

sendButton.addEventListener(

    "click",

    sendMessage

);



// ==========================================
// ENTER TO SEND
// ==========================================

messageInput.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key === "Enter"
        ) {


            event.preventDefault();


            sendMessage();

        }

    }

);



// ==========================================
// BACK
// ==========================================

backButton.addEventListener(

    "click",

    function() {

        history.back();

    }

);


</script>


</body>

</html>
