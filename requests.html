<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>শেষের আবেদনগুলি</title>


<style>

* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    padding: 20px 15px;

    background: #f5f5f5;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    color: #222;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-text-size-adjust: 100%;

    text-size-adjust: 100%;

}


.container {

    max-width: 700px;

    margin: auto;

}


.title {

    text-align: center;

    font-size: 32px;

    font-weight: bold;

    margin:
        10px 0 28px;

}


.title span {

    color: #d00000;

}


.card {

    background: #ffffff;

    border-radius: 24px;

    margin-bottom: 25px;

    padding:
        25px 22px 20px 30px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.12);

    border-left:
        8px solid #d00000;

}


.blood-group {

    font-size: 38px;

    font-weight: bold;

    color: #c80000;

    margin-bottom: 24px;

}


.row {

    font-size: 21px;

    margin: 15px 0;

    line-height: 1.55;

}


.row strong {

    font-weight: bold;

}


/* =========================
   UPDATE
========================= */

.update {

    margin-top: 22px;

    padding: 13px 15px;

    border-radius: 12px;

    font-size: 21px;

    font-weight: bold;

    border-left: 6px solid;

}


.update.green {

    background: #e7f8ec;

    color: #138a3d;

    border-color: #19a34a;

}


.update.yellow {

    background: #fff7d6;

    color: #9a7600;

    border-color: #e0b800;

}


.update.red {

    background: #ffe6e6;

    color: #c00000;

    border-color: #d00000;

}


.update.blue {

    background: #e9f2ff;

    color: #1769aa;

    border-color: #287bdc;

}


/* =========================
   STATUS CONTROL
========================= */

.status-control {

    margin-top: 10px;

}


.status-select {

    width: 100%;

    padding: 11px;

    border-radius: 10px;

    border:
        1px solid #ccc;

    font-size: 17px;

    background: white;

}


.status-save {

    width: 100%;

    margin-top: 8px;

    padding: 11px;

    border: none;

    border-radius: 10px;

    background: #333;

    color: white;

    font-size: 17px;

    font-weight: bold;

}


.status-save:active {

    transform: scale(0.98);

}


/* =========================
   BUTTONS
========================= */

.button-row {

    display: flex;

    gap: 10px;

    margin-top: 18px;

}


.call-button,
.message-button {

    flex: 1;

    display: block;

    text-align: center;

    text-decoration: none;

    color: white;

    font-size: 19px;

    font-weight: bold;

    padding: 13px 8px;

    border-radius: 12px;

    border: none;

}


.call-button {

    background: #168a3b;

}


.message-button {

    background: #087f73;

}


.call-button:active,
.message-button:active {

    transform: scale(0.98);

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    font-size: 21px;

    padding: 30px;

}


.error {

    text-align: center;

    color: #d00000;

    font-size: 20px;

    padding: 25px;

    word-break: break-word;

}


.error-details {

    margin-top: 15px;

    padding: 12px;

    background: #fff;

    border:
        1px solid #f0b0b0;

    border-radius: 10px;

    text-align: left;

    font-size: 15px;

    line-height: 1.5;

    color: #8b0000;

    word-break: break-word;

}


.empty {

    text-align: center;

    font-size: 21px;

    padding: 30px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

        padding:
            12px 8px;

    }


    .title {

        font-size: 26px;

        margin:
            8px 0 22px;

    }


    .card {

        padding:
            18px 15px 16px 20px;

        border-radius: 20px;

        margin-bottom: 18px;

        border-left-width: 7px;

    }


    .blood-group {

        font-size: 32px;

        margin-bottom: 18px;

    }


    .row {

        font-size: 17px;

        margin: 11px 0;

        line-height: 1.45;

    }


    .update {

        font-size: 17px;

        margin-top: 18px;

        padding:
            11px 13px;

    }


    .button-row {

        gap: 8px;

    }


    .call-button,
    .message-button {

        font-size: 17px;

        padding:
            11px 5px;

    }


    .error {

        font-size: 18px;

    }

}


@media (max-width: 380px) {

    .title {

        font-size: 24px;

    }


    .card {

        padding:
            16px 13px 14px 18px;

    }


    .blood-group {

        font-size: 30px;

    }


    .row {

        font-size: 16px;

    }


    .update {

        font-size: 16px;

    }


    .call-button,
    .message-button {

        font-size: 16px;

    }

}


::-webkit-scrollbar {

    width: 7px;

}


::-webkit-scrollbar-track {

    background: #f5f5f5;

}


::-webkit-scrollbar-thumb {

    background: #c9141b;

    border-radius: 10px;

}

</style>

</head>


<body>


<div class="container">


    <div class="title">

        🩸

        <span>
            শেষের আবেদনগুলি
        </span>

    </div>


    <div id="requestList">

        <div class="loading">

            ⏳ আবেদনগুলি লোড হচ্ছে...

        </div>

    </div>


</div>



<script type="module">


import {

    auth,
    db

}

from "./firebase-config.js";



import {

    onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

    ref,
    onValue,
    update

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// GLOBAL
// ==========================================

let currentUser = null;

let isAdmin = false;

let authReady = false;

let requestsListenerStarted = false;



// ==========================================
// REQUEST LIST ELEMENT
// ==========================================

const requestList =
    document.getElementById(
        "requestList"
    );



// ==========================================
// AUTH
// ==========================================

onAuthStateChanged(

    auth,

    async function(user) {


        currentUser = user;

        isAdmin = false;

        authReady = true;



        // ==================================
        // LOGIN থাকলে ADMIN CHECK
        // ==================================

        if (user) {

            try {


                const userSnapshot =

                    await new Promise(

                        function(resolve, reject) {


                            onValue(

                                ref(
                                    db,
                                    "users/" +
                                    user.uid
                                ),

                                resolve,

                                {

                                    onlyOnce: true

                                }

                            );

                        }

                    );



                const userData =
                    userSnapshot.val();



                if (

                    userData &&

                    userData.role === "admin"

                ) {

                    isAdmin = true;

                }


            }

            catch(error) {


                console.error(
                    "Admin check error:",
                    error
                );


            }

        }



        // ==================================
        // IMPORTANT
        // LOGIN থাকুক বা না থাকুক
        // REQUEST LOAD হবে
        // ==================================

        loadRequests();

    }

);



// ==========================================
// DATE
// ==========================================

function formatDate(value) {


    if (!value) {

        return "";

    }



    const dateString =
        String(value).trim();



    const match =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );



    if (match) {

        return (

            match[3] +
            "/" +
            match[2] +
            "/" +
            match[1]

        );

    }



    return dateString;

}



// ==========================================
// UPDATE COLOR
// ==========================================

function getUpdateClass(status) {


    const text =

        String(status || "")
        .trim()
        .toLowerCase();



    if (

        text === "managed"

    ) {

        return "green";

    }



    if (

        text === "pending"

    ) {

        return "yellow";

    }



    if (

        text === "request cancelled"

    ) {

        return "red";

    }



    return "blue";

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(value) {


    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// LOAD REQUESTS
// ==========================================

function loadRequests() {


    // ==================================
    // AUTH READY না হলে অপেক্ষা
    // ==================================

    if (!authReady) {

        return;

    }



    // ==================================
    // একই listener বারবার চালু না করা
    // ==================================

    if (requestsListenerStarted) {

        return;

    }


    requestsListenerStarted = true;



    // ==================================
    // DATABASE READ
    // ==================================
    //
    // Firebase Rules অনুযায়ী
    // bloodRequests READ public
    //
    // তাই Login ছাড়াও আবেদন দেখা যাবে
    //
    // ==================================

    onValue(

        ref(
            db,
            "bloodRequests"
        ),



        function(snapshot) {


            const value =
                snapshot.val();



            // ==================================
            // NO DATA
            // ==================================

            if (!value) {


                requestList.innerHTML = `

                    <div class="empty">

                        📭 এখন কোনো রক্তের আবেদন নেই।

                    </div>

                `;


                return;

            }



            // ==================================
            // REQUEST ARRAY
            // ==================================

            const requests =
                Object.values(value);



            // ==================================
            // SORT NEWEST FIRST
            // ==================================

            requests.sort(

                function(a, b) {


                    return (

                        Number(
                            b.createdAt || 0
                        )

                        -

                        Number(
                            a.createdAt || 0
                        )

                    );

                }

            );



            requestList.innerHTML = "";



            // ==================================
            // CREATE CARDS
            // ==================================

            requests.forEach(

                function(item) {


                    const requestId =

                        escapeHtml(
                            item.requestId
                        );



                    const reference =

                        escapeHtml(
                            item.reference
                        );



                    const problem =

                        escapeHtml(
                            item.problem
                        );



                    const bloodGroup =

                        escapeHtml(
                            item.bloodGroup
                        );



                    const hemoglobin =

                        escapeHtml(
                            item.hemoglobin
                        );



                    const date =

                        escapeHtml(
                            formatDate(
                                item.date
                            )
                        );



                    const time =

                        escapeHtml(
                            item.time
                        );



                    const hospital =

                        escapeHtml(
                            item.hospital
                        );



                    const mobile =

                        escapeHtml(
                            item.mobile
                        );



                    const status =

                        item.status ||

                        "No Update";



                    const updateClass =

                        getUpdateClass(
                            status
                        );



                    // ==================================
                    // STATUS PERMISSION
                    // ==================================

                    const canChangeStatus =

                        currentUser &&

                        (

                            isAdmin ||

                            currentUser.uid ===
                            item.uid

                        );



                    // ==================================
                    // CARD
                    // ==================================

                    const card =

                        document.createElement(
                            "div"
                        );



                    card.className =
                        "card";



                    card.innerHTML = `

                        <div class="blood-group">

                            🩸
                            ${bloodGroup}

                        </div>



                        <div class="row">

                            👤

                            <strong>
                                রেফারেন্স:
                            </strong>

                            ${reference}

                        </div>



                        <div class="row">

                            🩺

                            <strong>
                                রোগীর সমস্যা:
                            </strong>

                            ${problem}

                        </div>



                        <div class="row">

                            🧪

                            <strong>
                                হিমোগ্লোবিন:
                            </strong>

                            ${hemoglobin}

                        </div>



                        <div class="row">

                            📅

                            <strong>
                                রক্তদানের তারিখ:
                            </strong>

                            ${date}

                        </div>



                        <div class="row">

                            🕒

                            <strong>
                                রক্তদানের সময়:
                            </strong>

                            ${time}

                        </div>



                        <div class="row">

                            🏥

                            <strong>
                                হাসপাতাল:
                            </strong>

                            ${hospital}

                        </div>



                        <div class="row">

                            📱

                            <strong>
                                যোগাযোগ:
                            </strong>

                            ${mobile}

                        </div>



                        <div
                            class="update ${updateClass}"
                        >

                            Update:

                            ${escapeHtml(status)}

                        </div>



                        ${

                            canChangeStatus

                            ?

                            `

                            <div
                                class="status-control"
                            >

                                <select
                                    class="status-select"
                                    data-request-id="${requestId}"
                                >

                                    <option
                                        value="No Update"
                                        ${
                                            status ===
                                            "No Update"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >

                                        🔵 No Update

                                    </option>



                                    <option
                                        value="Pending"
                                        ${
                                            status ===
                                            "Pending"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >

                                        🟡 Pending

                                    </option>



                                    <option
                                        value="Managed"
                                        ${
                                            status ===
                                            "Managed"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >

                                        🟢 Managed

                                    </option>



                                    <option
                                        value="Request Cancelled"
                                        ${
                                            status ===
                                            "Request Cancelled"
                                            ?
                                            "selected"
                                            :
                                            ""
                                        }
                                    >

                                        🔴 Request Cancelled

                                    </option>

                                </select>



                                <button
                                    class="status-save"
                                    data-request-id="${requestId}"
                                >

                                    Update Status

                                </button>

                            </div>

                            `

                            :

                            ""

                        }



                        <div class="button-row">


                            <a
                                class="call-button"
                                href="tel:${mobile}"
                            >

                                📞 কল করুন

                            </a>



                            <a
                                class="message-button"
                                href="conversation.html?requestId=${encodeURIComponent(
                                    item.requestId || ""
                                )}"
                            >

                                💬 মেসেজ করুন

                            </a>


                        </div>

                    `;



                    requestList.appendChild(
                        card
                    );

                }

            );



            // ==================================
            // STATUS BUTTON
            // ==================================

            document
                .querySelectorAll(
                    ".status-save"
                )
                .forEach(

                    function(button) {


                        button.addEventListener(

                            "click",

                            async function() {


                                // ==================================
                                // LOGIN CHECK
                                // ==================================

                                if (!currentUser) {


                                    alert(
                                        "⚠️ Status পরিবর্তন করতে আগে Login করুন।"
                                    );


                                    return;

                                }



                                // ==================================
                                // REQUEST ID
                                // ==================================

                                const id =

                                    button.dataset
                                    .requestId;



                                // ==================================
                                // SELECT
                                // ==================================

                                const select =

                                    cardSelect(
                                        button,
                                        id
                                    );



                                if (!select) {

                                    return;

                                }



                                const newStatus =
                                    select.value;



                                // ==================================
                                // BUTTON DISABLE
                                // ==================================

                                button.disabled =
                                    true;



                                button.innerText =
                                    "⏳ আপডেট হচ্ছে...";



                                try {


                                    await update(

                                        ref(

                                            db,

                                            "bloodRequests/" +
                                            id

                                        ),

                                        {

                                            status:
                                                newStatus,

                                            updatedAt:
                                                Date.now(),

                                            updatedBy:
                                                currentUser.uid

                                        }

                                    );



                                    alert(
                                        "✅ Status আপডেট হয়েছে।"
                                    );


                                }

                                catch(error) {


                                    console.error(
                                        "Status Update Error:",
                                        error
                                    );


                                    console.error(
                                        "Error Code:",
                                        error &&
                                        error.code
                                    );


                                    console.error(
                                        "Error Message:",
                                        error &&
                                        error.message
                                    );


                                    alert(

                                        "❌ Status আপডেট করা যায়নি।\n\n" +

                                        (

                                            error &&
                                            error.message
                                            ?

                                            error.message

                                            :

                                            "Unknown Firebase Error"

                                        )

                                    );

                                }



                                finally {


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Update Status";

                                }


                            }

                        );

                    }

                );



        },



        // ==================================
        // DATABASE ERROR
        // ==================================

        function(error) {


            console.error(
                "Firebase Database Error:",
                error
            );


            console.error(
                "Error Code:",
                error &&
                error.code
            );


            console.error(
                "Error Message:",
                error &&
                error.message
            );



            const errorMessage =

                error &&
                error.message

                ?

                error.message

                :

                "Unknown Firebase Error";



            const errorCode =

                error &&
                error.code

                ?

                error.code

                :

                "unknown";



            requestList.innerHTML = `

                <div class="error">

                    ❌ আবেদনগুলি লোড করা যাচ্ছে না।

                    <br><br>

                    <strong>
                        Firebase Database Error
                    </strong>


                    <div class="error-details">

                        <strong>
                            Error Code:
                        </strong>

                        <br>

                        ${escapeHtml(errorCode)}

                        <br><br>


                        <strong>
                            Error Message:
                        </strong>

                        <br>

                        ${escapeHtml(errorMessage)}

                    </div>

                </div>

            `;

        }

    );

}



// ==========================================
// FIND STATUS SELECT
// ==========================================

function cardSelect(
    button,
    requestId
) {


    const controls =

        button

            .closest(".card")

            .querySelector(
                ".status-select"
            );


    return controls || null;

}

</script>


</body>

</html>
