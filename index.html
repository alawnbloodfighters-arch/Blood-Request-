<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>সদস্য নিবন্ধন | আল-আওন ব্লাড ফাইটার্স</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo" alt="Logo">

<h2>আল-আওন ব্লাড ফাইটার্স</h2>

<p>সদস্য নিবন্ধন ফরম</p>

</div>

<div class="card">

<form id="memberForm">

<label>👤 পূর্ণ নাম</label>

<input
type="text"
id="name"
placeholder="আপনার পূর্ণ নাম লিখুন"
required>

<label>⚧️ লিঙ্গ</label>

<select id="gender" required>

<option value="">নির্বাচন করুন</option>

<option>পুরুষ</option>

<option>মহিলা</option>

</select>

<label>🎂 জন্ম তারিখ</label>

<div class="dob">

<select id="day" required>

<option value="">দিন</option>

</select>

<select id="month" required>

<option value="">মাস</option>

<option>জানুয়ারি</option>
<option>ফেব্রুয়ারি</option>
<option>মার্চ</option>
<option>এপ্রিল</option>
<option>মে</option>
<option>জুন</option>
<option>জুলাই</option>
<option>আগস্ট</option>
<option>সেপ্টেম্বর</option>
<option>অক্টোবর</option>
<option>নভেম্বর</option>
<option>ডিসেম্বর</option>

</select>

<select id="year" required>

<option value="">বছর</option>

</select>

</div>
<label>🩸 রক্তের গ্রুপ</label>

<select id="bloodGroup" required>

<option value="">নির্বাচন করুন</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

<label>⚖️ ওজন (কেজি)</label>

<select id="weight" required>

<option value="">নির্বাচন করুন</option>

<option>35+</option>
<option>40+</option>
<option>45+</option>
<option>50+</option>
<option>55+</option>
<option>60+</option>
<option>65+</option>
<option>70+</option>
<option>75+</option>
<option>80+</option>
<option>85+</option>
<option>90+</option>
<option>95+</option>
<option>100+</option>
<option>105+</option>
<option>110+</option>
<option>115+</option>
<option>120+</option>

</select>

<label>🩸 সর্বশেষ রক্তদানের তারিখ</label>

<input
type="date"
id="lastDonate">

<label>📍 জেলা</label>

<select id="district" required>

<option value="">জেলা নির্বাচন করুন</option>

<option>ফেনী</option>
<option>কুমিল্লা</option>
<option>নোয়াখালী</option>
<option>চট্টগ্রাম</option>
<option>ঢাকা</option>

</select>
<label>📍 উপজেলা</label>

<select id="upazila" required>
<option value="">আগে জেলা নির্বাচন করুন</option>
</select>

<label>📱 মোবাইল নম্বর</label>

<input
type="tel"
id="mobile"
maxlength="11"
placeholder="01XXXXXXXXX"
required>

<button type="submit">
✅ সদস্য নিবন্ধন করুন
</button>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
