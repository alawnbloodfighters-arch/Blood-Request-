<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>কথোপকথন</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

}


body {

    background: #eee9e2;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow: hidden;

}


/* =========================
   HEADER
========================= */

.chat-header {

    height: 82px;

    background: #087f73;

    color: white;

    display: flex;

    align-items: center;

    padding:
        10px 15px;

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    z-index: 10;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.18);

}


.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 30px;

    padding: 5px 10px 5px 0;

    cursor: pointer;

}


.header-info {

    overflow: hidden;

}


.header-title {

    font-size: 22px;

    font-weight: bold;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.header-subtitle {

    font-size: 14px;

    margin-top: 3px;

    opacity: .9;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   CHAT AREA
========================= */

.chat-area {

    position: fixed;

    top: 82px;

    bottom: 75px;

    left: 0;

    right: 0;

    overflow-y: auto;

    padding:
        18px 14px 25px;

}


.message {

    max-width: 78%;

    margin-bottom: 12px;

    padding:
        12px 14px 9px;

    border-radius: 18px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.08);

    word-wrap: break-word;

}


/* রিকুয়েস্টকারীর মেসেজ */

.message.requester {

    margin-left: auto;

    background: #ffb2b2;

    color: #6d0000;

    border-bottom-right-radius: 5px;

}


/* অন্যান্য ব্যবহারকারীর মেসেজ */

.message.other {

    margin-right: auto;

    background: #ffffff;

    color: #222;

    border-bottom-left-radius: 5px;

}


/* নিজের মেসেজ */

.message.me {

    margin-left: auto;

    background: #d7f4ef;

    color: #07584f;

    border-bottom-right-radius: 5px;

}


.sender-name {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;

    color: #087f73;

}


.requester .sender-name {

    color: #b00000;

}


.me .sender-name {

    color: #087f73;

}


.message-text {

    font-size: 19px;

    line-height: 1.45;

    white-space: pre-wrap;

}


.message-time {

    text-align: right;

    margin-top: 5px;

    font-size: 12px;

    color: #777;

}


.requester .message-time {

    color: #8d3b3b;

}


.me .message-time {

    color: #357a73;

}


/* =========================
   EMPTY
========================= */

.empty-chat {

    text-align: center;

    color: #777;

    font-size: 18px;

    padding: 30px 10px;

}


/* =========================
   INPUT
========================= */

.chat-input-area {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 75px;

    background: #ffffff;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 12px;

    border-top:
        1px solid #ddd;

    z-index: 10;

}


.message-input {

    flex: 1;

    height: 55px;

    border:
        1px solid #ddd;

    border-radius: 28px;

    padding:
        0 18px;

    font-size: 18px;

    outline: none;

}


.message-input:focus {

    border-color:
        #087f73;

}


.send-button {

    width: 100px;

    height: 55px;

    border: none;

    border-radius: 28px;

    background: #087f73;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


.send-button:disabled {

    opacity: .6;

}


/* =========================
   LOGIN / ERROR
========================= */

.login-message {

    text-align: center;

    padding: 40px 20px;

    font-size: 19px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .chat-header {

        height: 72px;

    }


    .chat-area {

        top: 72px;

        bottom: 70px;

    }


    .chat-input-area {

        height: 70px;

    }


    .message {

        max-width: 84%;

    }


    .message-text {

        font-size: 18px;

    }


    .header-title {

        font-size: 19px;

    }


    .send-button {

        width: 82px;

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="chat-header">


    <button
        class="back-button"
        onclick="history.back()"
    >

        ‹

    </button>


    <div class="header-info">


        <div
            class="header-title"
            id="chatTitle"
        >

            💬 কথোপকথন

        </div>


        <div
            class="header-subtitle"
            id="chatSubtitle"
        >

            লোড হচ্ছে...

        </div>


    </div>


</div>



<!-- =========================
     CHAT AREA
========================= -->

<div
    class="chat-area"
    id="chatArea"
>

    <div class="empty-chat">

        ⏳ মেসেজ লোড হচ্ছে...

    </div>

</div>



<!-- =========================
     INPUT
========================= -->

<div
    class="chat-input-area"
    id="inputArea"
>


    <input
        type="text"
        class="message-input"
        id="messageInput"
        placeholder="মেসেজ লিখুন"
        autocomplete="off"
    >


    <button
        class="send-button"
        id="sendButton"
    >

        Send

    </button>


</div>



<script type="module">


import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    push,
    set

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* ==========================================
   REQUEST ID
========================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const requestId =
    urlParams.get(
        "requestId"
    );



/* ==========================================
   ELEMENTS
========================================== */

const chatArea =
    document.getElementById(
        "chatArea"
    );


const chatTitle =
    document.getElementById(
        "chatTitle"
    );


const chatSubtitle =
    document.getElementById(
        "chatSubtitle"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );



/* ==========================================
   GLOBAL
========================================== */

let currentUser = null;

let requestData = null;

let requestExists = false;



/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {


    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==========================================
   TIME FORMAT
========================================== */

function formatTime(timestamp) {


    if (!timestamp) {

        return "";

    }


    const date =
        new Date(
            Number(timestamp)
        );


    return date.toLocaleTimeString(

        "bn-BD",

        {

            hour:
                "numeric",

            minute:
                "2-digit"

        }

    );

}



/* ==========================================
   DISABLE CHAT
========================================== */

function disableChat() {


    sendButton.disabled =
        true;


    messageInput.disabled =
        true;

}



/* ==========================================
   ENABLE CHAT
========================================== */

function enableChat() {


    sendButton.disabled =
        false;


    messageInput.disabled =
        false;

}



/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(

    auth,

    function(user) {


        currentUser = user;


        /* ==============================
           LOGIN CHECK
        ============================== */

        if (!user) {


            chatArea.innerHTML = `

                <div class="login-message">

                    ⚠️ মেসেজ দেখতে ও পাঠাতে Login করতে হবে।

                </div>

            `;


            disableChat();


            return;

        }



        /* ==============================
           REQUEST ID CHECK
        ============================== */

        if (!requestId) {


            chatArea.innerHTML = `

                <div class="login-message">

                    ❌ Request ID পাওয়া যায়নি।

                </div>

            `;


            disableChat();


            return;

        }



        /* ==============================
           REQUEST LOAD FIRST
        ============================== */

        loadRequest();

    }

);



/* ==========================================
   LOAD REQUEST
========================================== */

function loadRequest() {


    onValue(

        ref(

            db,

            "bloodRequests/" +
            requestId

        ),

        function(snapshot) {


            requestData =
                snapshot.val();



            /* ==============================
               REQUEST NOT FOUND
            ============================== */

            if (!requestData) {


                requestExists =
                    false;


                chatTitle.innerText =
                    "❌ Request পাওয়া যায়নি";


                chatSubtitle.innerText =
                    "";


                chatArea.innerHTML = `

                    <div class="login-message">

                        ❌ এই রক্তের আবেদনটি পাওয়া যায়নি।

                    </div>

                `;


                disableChat();


                return;

            }



            /* ==============================
               REQUEST FOUND
            ============================== */

            requestExists =
                true;


            chatTitle.innerText =

                "💬 " +

                (
                    requestData.bloodGroup ||
                    "Blood Request"
                );



            chatSubtitle.innerText =

                "রেফারেন্স: " +

                (
                    requestData.reference ||
                    ""
                );



            enableChat();



            /* ==============================
               LOAD PUBLIC MESSAGES
            ============================== */

            loadMessages();

        }

    );

}



/* ==========================================
   LOAD MESSAGES
========================================== */

function loadMessages() {


    onValue(

        ref(

            db,

            "bloodRequests/" +
            requestId +
            "/messages"

        ),

        function(snapshot) {


            const data =
                snapshot.val();



            /* ==============================
               NO MESSAGE
            ============================== */

            if (!data) {


                chatArea.innerHTML = `

                    <div class="empty-chat">

                        💬 এখনো কোনো মেসেজ নেই।

                        <br><br>

                        প্রথম মেসেজটি আপনিই পাঠান।

                    </div>

                `;


                return;

            }



            /* ==============================
               OBJECT → ARRAY
            ============================== */

            const messages =
                Object.values(data);



            /* ==============================
               SORT
            ============================== */

            messages.sort(

                function(a, b) {


                    return (

                        Number(
                            a.createdAt || 0
                        )

                        -

                        Number(
                            b.createdAt || 0
                        )

                    );

                }

            );



            /* ==============================
               CLEAR CHAT
            ============================== */

            chatArea.innerHTML =
                "";



            /* ==============================
               CREATE MESSAGE
            ============================== */

            messages.forEach(

                function(message) {


                    const isRequester =

                        requestData &&

                        message.uid ===
                        requestData.uid;



                    const isMe =

                        currentUser &&

                        message.uid ===
                        currentUser.uid;



                    const messageDiv =
                        document.createElement(
                            "div"
                        );



                    /* ==========================
                       MESSAGE TYPE
                    ========================== */

                    if (isRequester) {


                        messageDiv.className =
                            "message requester";

                    }


                    else if (isMe) {


                        messageDiv.className =
                            "message me";

                    }


                    else {


                        messageDiv.className =
                            "message other";

                    }



                    const senderName =
                        escapeHtml(

                            message.senderName ||

                            "ব্যবহারকারী"

                        );



                    const messageText =
                        escapeHtml(
                            message.text
                        );



                    const time =
                        formatTime(
                            message.createdAt
                        );



                    messageDiv.innerHTML = `

                        <div class="sender-name">

                            ${senderName}

                        </div>


                        <div class="message-text">

                            ${messageText}

                        </div>


                        <div class="message-time">

                            ${time}

                        </div>

                    `;



                    chatArea.appendChild(
                        messageDiv
                    );

                }

            );



            /* ==============================
               SCROLL LAST MESSAGE
            ============================== */

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },

        function(error) {


            console.error(
                "Message Load Error:",
                error
            );


            chatArea.innerHTML = `

                <div class="login-message">

                    ❌ মেসেজ লোড করা যাচ্ছে না।

                    <br><br>

                    Firebase Rules পরীক্ষা করুন।

                </div>

            `;

        }

    );

}



/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {


    /* ==============================
       LOGIN CHECK
    ============================== */

    if (!currentUser) {


        alert(
            "⚠️ আগে Login করুন।"
        );


        return;

    }



    /* ==============================
       REQUEST CHECK
    ============================== */

    if (

        !requestId ||

        !requestExists

    ) {


        alert(
            "❌ এই Request-এ মেসেজ পাঠানো যাবে না।"
        );


        return;

    }



    /* ==============================
       MESSAGE TEXT
    ============================== */

    const text =
        messageInput.value
        .trim();



    if (!text) {

        return;

    }



    /* ==============================
       DISABLE SEND
    ============================== */

    sendButton.disabled =
        true;


    sendButton.innerText =
        "...";



    try {


        /* ==============================
           MESSAGE LOCATION
        ============================== */

        const messagesRef =

            ref(

                db,

                "bloodRequests/" +
                requestId +
                "/messages"

            );



        const messageRef =
            push(
                messagesRef
            );



        /* ==============================
           SENDER NAME
        ============================== */

        const senderName =

            currentUser.displayName ||

            requestData?.requesterName ||

            currentUser.email ||

            "ব্যবহারকারী";



        /* ==============================
           MESSAGE DATA
        ============================== */

        const messageData = {


            uid:

                currentUser.uid,


            senderName:

                senderName,


            senderEmail:

                currentUser.email || "",


            text:

                text,


            createdAt:

                Date.now()

        };



        /* ==============================
           SAVE
        ============================== */

        await set(

            messageRef,

            messageData

        );



        /* ==============================
           CLEAR INPUT
        ============================== */

        messageInput.value =
            "";


    }

    catch(error) {


        console.error(
            "Message Error:",
            error
        );


        alert(
            "❌ মেসেজ পাঠানো যায়নি।\n\nFirebase Rules পরীক্ষা করুন।"
        );

    }


    finally {


        sendButton.disabled =
            false;


        sendButton.innerText =
            "Send";


        messageInput.focus();

    }

}



/* ==========================================
   SEND BUTTON
========================================== */

sendButton.addEventListener(

    "click",

    sendMessage

);



/* ==========================================
   ENTER TO SEND
========================================== */

messageInput.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key ===
            "Enter"

        ) {


            event.preventDefault();


            sendMessage();

        }

    }

);


</script>


</body>

</html>
