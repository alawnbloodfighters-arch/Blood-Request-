<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>শেষের আবেদনগুলি</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 15px;
    background: #f5f5f5;
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
}


/* =========================
   Title
========================= */

.title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin: 10px 0 28px;
}

.title span {
    color: #d00000;
}


/* =========================
   Card
========================= */

.card {
    background: #ffffff;
    border-radius: 24px;
    margin-bottom: 25px;
    padding: 25px 22px 20px 30px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
    border-left: 8px solid #d00000;
}


/* =========================
   Blood Group
========================= */

.blood-group {
    font-size: 38px;
    font-weight: bold;
    color: #c80000;
    margin-bottom: 24px;
}


/* =========================
   Information
========================= */

.row {
    font-size: 21px;
    margin: 15px 0;
    line-height: 1.55;
}

.row strong {
    font-weight: bold;
}


/* =========================
   UPDATE
========================= */

.update {
    margin-top: 22px;
    padding: 13px 15px;
    border-radius: 12px;
    font-size: 21px;
    font-weight: bold;
    border-left: 6px solid;
}


/* 🟢 Managed */

.update.green {
    background: #e7f8ec;
    color: #138a3d;
    border-color: #19a34a;
}


/* 🟡 Pending */

.update.yellow {
    background: #fff7d6;
    color: #9a7600;
    border-color: #e0b800;
}


/* 🔴 Request Cancelled */

.update.red {
    background: #ffe6e6;
    color: #c00000;
    border-color: #d00000;
}


/* =========================
   Unknown Update
========================= */

.update.blue {
    background: #e9f2ff;
    color: #1769aa;
    border-color: #287bdc;
}


/* =========================
   Call Button
========================= */

.call-button {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #168a3b;
    color: white;
    font-size: 21px;
    font-weight: bold;
    padding: 13px;
    border-radius: 12px;
    margin-top: 18px;
}

.call-button:active {
    transform: scale(0.98);
}


/* =========================
   Loading
========================= */

.loading {
    text-align: center;
    font-size: 21px;
    padding: 30px;
}


/* =========================
   Error
========================= */

.error {
    text-align: center;
    color: #d00000;
    font-size: 20px;
    padding: 25px;
}


/* =========================
   Empty
========================= */

.empty {
    text-align: center;
    font-size: 21px;
    padding: 30px;
}


/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    .title {
        font-size: 29px;
    }

    .card {
        padding: 22px 17px 18px 24px;
        border-radius: 22px;
    }

    .blood-group {
        font-size: 36px;
    }

    .row {
        font-size: 19px;
    }

    .update {
        font-size: 19px;
    }

    .call-button {
        font-size: 20px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- Title -->

    <div class="title">

        🩸 <span>শেষের আবেদনগুলি</span>

    </div>


    <!-- Request List -->

    <div id="requestList">

        <div class="loading">

            ⏳ আবেদনগুলি লোড হচ্ছে...

        </div>

    </div>


</div>



<script>


/* ==================================
   Google Apps Script URL
================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzJLYulqrxXeJeyt2tZhKI34eSed-dx6LMca2JaxVQttdRFtWfDXUnEt1n4nW0l7Tfp8Q/exec";



/* ==================================
   Date Format
================================== */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const dateString =
        String(value).trim();


    const bdDateMatch =
        dateString.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );


    if (bdDateMatch) {

        return dateString;

    }


    const dateOnlyMatch =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if (dateOnlyMatch) {

        const year =
            dateOnlyMatch[1];

        const month =
            dateOnlyMatch[2];

        const day =
            dateOnlyMatch[3];

        return `${day}/${month}/${year}`;

    }


    const isoMatch =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})T/
        );


    if (isoMatch) {

        const year =
            isoMatch[1];

        const month =
            isoMatch[2];

        const day =
            isoMatch[3];

        return `${day}/${month}/${year}`;

    }


    return dateString;

}



/* ==================================
   Update Color
================================== */

function getUpdateClass(update) {

    if (!update) {

        return "blue";

    }


    let text =
        String(update)
        .trim()
        .toLowerCase();


    if (text === "managed") {

        return "green";

    }


    if (text === "pending") {

        return "yellow";

    }


    if (text === "request cancelled") {

        return "red";

    }


    return "blue";

}



/* ==================================
   Load Requests
================================== */

async function loadRequests() {


    const requestList =
        document.getElementById(
            "requestList"
        );


    try {


        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Server Error"
            );

        }


        const data =
            await response.json();



        if (
            !data ||
            data.length === 0
        ) {


            requestList.innerHTML = `

                <div class="empty">

                    📭 এখন কোনো রক্তের আবেদন নেই।

                </div>

            `;


            return;

        }



        data.reverse();


        requestList.innerHTML = "";



        data.forEach(function(item) {


            const reference =
                String(
                    item.reference || ""
                );


            const problem =
                String(
                    item.problem || ""
                );


            const bloodGroup =
                String(
                    item.bloodGroup || ""
                );


            const hemoglobin =
                String(
                    item.hemoglobin || ""
                );


            const date =
                String(
                    item.date || ""
                );


            const time =
                String(
                    item.time || ""
                );


            const hospital =
                String(
                    item.hospital || ""
                );


            const mobile =
                String(
                    item.mobile || ""
                );


            const update =
                String(
                    item.note || ""
                );



            const updateClass =
                getUpdateClass(update);



            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";



            card.innerHTML = `


                <div class="blood-group">

                    🩸 ${bloodGroup}

                </div>



                <div class="row">

                    👤

                    <strong>
                        রেফারেন্স:
                    </strong>

                    ${reference}

                </div>



                <div class="row">

                    🩺

                    <strong>
                        রোগীর সমস্যা:
                    </strong>

                    ${problem}

                </div>



                <div class="row">

                    🧪

                    <strong>
                        হিমোগ্লোবিন:
                    </strong>

                    ${hemoglobin}

                </div>



                <div class="row">

                    📅

                    <strong>
                        রক্তদানের তারিখ:
                    </strong>

                    ${formatDate(date)}

                </div>



                <div class="row">

                    🕒

                    <strong>
                        রক্তদানের সময়:
                    </strong>

                    ${time}

                </div>



                <div class="row">

                    🏥

                    <strong>
                        হাসপাতাল:
                    </strong>

                    ${hospital}

                </div>



                <div class="row">

                    📱

                    <strong>
                        যোগাযোগ:
                    </strong>

                    ${mobile}

                </div>



                <div
                    class="update ${updateClass}"
                >

                    Update:
                    ${update || "No Update"}

                </div>



                <a
                    class="call-button"
                    href="tel:${mobile}"
                >

                    📞 কল করুন

                </a>


            `;



            requestList.appendChild(
                card
            );


        });


    }


    catch (error) {


        console.error(error);


        requestList.innerHTML = `

            <div class="error">

                ❌ আবেদনগুলি লোড করা যাচ্ছে না।

                <br><br>

                ইন্টারনেট সংযোগ পরীক্ষা করুন।

            </div>

        `;


    }

}



/* ==================================
   Page Load
================================== */

loadRequests();


</script>


</body>

</html>
