    background: #087f73;
}

.message-button:active {
    transform: scale(0.98);
}


/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    font-size: 21px;
    padding: 30px;
}


/* =========================
   ERROR
========================= */

.error {
    text-align: center;
    color: #d00000;
    font-size: 20px;
    padding: 25px;
}

   EMPTY

    padding: 30px;

    body {
        padding: 12px 8px;
    }

    .title {
        font-size: 26px;
        margin: 8px 0 22px;
    }

        padding: 18px 15px 16px 20px;
        border-radius: 20px;
        margin-bottom: 18px;
        border-left-width: 7px;
    }

    .blood-group {
        font-size: 32px;
        margin-bottom: 18px;
    }

    .row {
        font-size: 17px;
        margin: 11px 0;
        line-height: 1.45;
    }

    .update {
        font-size: 17px;
        margin-top: 18px;
        padding: 11px 13px;
    }

    .button-row {

    }

    }

   SMALL MOBILE
========================= */

@media (max-width: 380px) {

    .title {
        font-size: 24px;
    }

    .card {
        padding: 16px 13px 14px 18px;
    }

    .blood-group {

    }

    .row {
        font-size: 16px;
    }

        font-size: 16px;

</style></head><body><div class="container"><div class="title">

    🩸

    <span>
        শেষের আবেদনগুলি
    </span>

</div>


<div id="requestList">

    <div class="loading">

        ⏳ আবেদনগুলি লোড হচ্ছে...

    </div>

</div>

</div><script type="module">


/* =========================================
   FIREBASE CONFIG
========================================= */

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue,
    update

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID_1 =
    "TAWXxissVvXqHVK9gCrdxzM9Qjf2";


const ADMIN_UID_2 =
    "y3HwNswW8wYIi6GOEbZauIhcyis1";



/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let isAdmin = false;

let requestsLoaded = false;



/* =========================================
   REQUEST LIST
========================================= */

const requestList =
    document.getElementById(
        "requestList"
    );



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(

    auth,

    function(user) {


        currentUser = user;

        isAdmin = false;


        /* ==============================
           LOGIN REQUIRED
        ============================== */

        if (!user) {


            requestList.innerHTML = `

                <div class="error">

                    ⚠️ আবেদন দেখতে আগে Login করুন।

                </div>

            `;


            return;

        }



        /* ==============================
           ADMIN CHECK
        ============================== */

        isAdmin =

            user.uid === ADMIN_UID_1 ||

            user.uid === ADMIN_UID_2;



        /* ==============================
           LOAD REQUESTS
        ============================== */

        if (!requestsLoaded) {

            requestsLoaded = true;

            loadRequests();

        }

    }

);



/* =========================================
   DATE FORMAT
========================================= */

function formatDate(value) {


    if (!value) {

        return "";

    }


    const dateString =
        String(value).trim();



    /*

       YYYY-MM-DD

    */

    const match =
        dateString.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        return (

            match[3] +
            "/" +
            match[2] +
            "/" +
            match[1]

        );

    }


    return dateString;

}



/* =========================================
   UPDATE COLOR
========================================= */

function getUpdateClass(status) {


    const text =

        String(status || "")
        .trim()
        .toLowerCase();



    if (text === "managed") {

        return "green";

    }


    if (text === "pending") {

        return "yellow";

    }


    if (
        text === "request cancelled"
    ) {

        return "red";

    }


    return "blue";

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {


    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================
   LOAD REQUESTS
========================================= */

function loadRequests() {


    requestList.innerHTML = `

        <div class="loading">

            ⏳ আবেদনগুলি লোড হচ্ছে...

        </div>

    `;



    const requestsRef =
        ref(
            db,
            "bloodRequests"
        );



    onValue(

        requestsRef,


        function(snapshot) {


            const value =
                snapshot.val();



            /* ==========================
               NO REQUEST
            ========================== */

            if (!value) {


                requestList.innerHTML = `

                    <div class="empty">

                        📭 এখন কোনো রক্তের আবেদন নেই।

                    </div>

                `;


                return;

            }



            /* ==========================
               CONVERT OBJECT TO ARRAY
            ========================== */

            const requests =

                Object.entries(value)

                .map(

                    function(entry) {


                        const firebaseKey =
                            entry[0];


                        const item =
                            entry[1] || {};



                        /*

                           Firebase key-কে
                           requestId হিসেবে ব্যবহার

                        */

                        return {

                            ...item,

                            requestId:

                                item.requestId ||
                                firebaseKey

                        };

                    }

                );



            /* ==========================
               SORT NEWEST FIRST
            ========================== */

            requests.sort(

                function(a, b) {


                    return (

                        Number(
                            b.createdAt || 0
                        )

                        -

                        Number(
                            a.createdAt || 0
                        )

                    );

                }

            );



            requestList.innerHTML = "";



            /* ==========================
               CREATE CARDS
            ========================== */

            requests.forEach(

                function(item) {


                    const requestId =
                        String(
                            item.requestId || ""
                        );


                    const reference =
                        escapeHtml(
                            item.reference
                        );


                    const problem =
                        escapeHtml(
                            item.problem
                        );


                    const bloodGroup =
                        escapeHtml(
                            item.bloodGroup
                        );


                    const hemoglobin =
                        escapeHtml(
                            item.hemoglobin
                        );


                    const date =
                        escapeHtml(
                            formatDate(
                                item.date
                            )
                        );


                    const time =
                        escapeHtml(
                            item.time
                        );


                    const hospital =
                        escapeHtml(
                            item.hospital
                        );


                    const mobile =
                        escapeHtml(
                            item.mobile
                        );


                    const status =

                        String(
                            item.status ||
                            "No Update"
                        );



                    const updateClass =

                        getUpdateClass(
                            status
                        );



                    /* ==========================
                       STATUS PERMISSION
                    ========================== */

                    const canChangeStatus =

                        currentUser &&

                        (

                            isAdmin ||

                            currentUser.uid ===
                            item.uid

                        );



                    /* ==========================
                       CARD
                    ========================== */

                    const card =

                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";



                    card.innerHTML = `

                        <div class="blood-group">

                            🩸
                            ${bloodGroup}

                        </div>



                        <div class="row">

                            👤

                            <strong>
                                রেফারেন্স:
                            </strong>

                            ${reference}

                        </div>



                        <div class="row">

                            🩺

                            <strong>
                                রোগীর সমস্যা:
                            </strong>

                            ${problem}

                        </div>



                        <div class="row">

                            🧪

                            <strong>
                                হিমোগ্লোবিন:
                            </strong>

                            ${hemoglobin}

                        </div>



                        <div class="row">

                            📅

                            <strong>
                                রক্তদানের তারিখ:
                            </strong>

                            ${date}

                        </div>



                        <div class="row">

                            🕒

                            <strong>
                                রক্তদানের সময়:
                            </strong>

                            ${time}

                        </div>



                        <div class="row">

                            🏥

                            <strong>
                                হাসপাতাল:
                            </strong>

                            ${hospital}

                        </div>



                        <div class="row">

                            📱

                            <strong>
                                যোগাযোগ:
                            </strong>

                            ${mobile}

                        </div>



                        <div
                            class="update ${updateClass}"
                        >

                            Update:

                            ${escapeHtml(status)}

                        </div>



                        ${
                            canChangeStatus

                            ?

                            `

                            <div class="status-control">


                                <select
                                    class="status-select"
                                >

                                    <option
                                        value="No Update"
                                        ${status === "No Update" ? "selected" : ""}
                                    >
                                        🔵 No Update
                                    </option>


                                    <option
                                        value="Pending"
                                        ${status === "Pending" ? "selected" : ""}
                                    >
                                        🟡 Pending
                                    </option>


                                    <option
                                        value="Managed"
                                        ${status === "Managed" ? "selected" : ""}
                                    >
                                        🟢 Managed
                                    </option>


                                    <option
                                        value="Request Cancelled"
                                        ${status === "Request Cancelled" ? "selected" : ""}
                                    >
                                        🔴 Request Cancelled
                                    </option>

                                </select>



                                <button
                                    class="status-save"
                                >

                                    Update Status

                                </button>


                            </div>

                            `

                            :

                            ""

                        }



                        <div class="button-row">


                            <a
                                class="call-button"
                                href="tel:${mobile}"
                            >

                                📞 কল করুন

                            </a>



                            <a
                                class="message-button"
                                href="conversation.html?requestId=${encodeURIComponent(requestId)}"
                            >

                                💬 মেসেজ করুন

                            </a>


                        </div>

                    `;



                    requestList.appendChild(
                        card
                    );



                    /* ==========================
                       STATUS UPDATE BUTTON
                    ========================== */

                    if (
                        canChangeStatus
                    ) {


                        const select =

                            card.querySelector(
                                ".status-select"
                            );


                        const saveButton =

                            card.querySelector(
                                ".status-save"
                            );



                        saveButton.addEventListener(

                            "click",

                            async function() {


                                if (!currentUser) {


                                    alert(
                                        "⚠️ আগে Login করুন।"
                                    );


                                    return;

                                }



                                const newStatus =
                                    select.value;



                                saveButton.disabled =
                                    true;


                                saveButton.innerText =
                                    "⏳ আপডেট হচ্ছে...";



                                try {


                                    await update(

                                        ref(

                                            db,

                                            "bloodRequests/" +
                                            requestId

                                        ),

                                        {

                                            status:
                                                newStatus,

                                            updatedAt:
                                                Date.now(),

                                            updatedBy:
                                                currentUser.uid

                                        }

                                    );



                                    alert(
                                        "✅ Status আপডেট হয়েছে।"
                                    );


                                }

                                catch(error) {


                                    console.error(
                                        "Status Update Error:",
                                        error
                                    );


                                    alert(

                                        "❌ Status আপডেট করা যায়নি।\n\n" +

                                        (
                                            error.message ||
                                            "Firebase Database Rules পরীক্ষা করুন।"
                                        )

                                    );

                                }



                                finally {


                                    saveButton.disabled =
                                        false;


                                    saveButton.innerText =
                                        "Update Status";

                                }

                            }

                        );

                    }

                }

            );

        },


        function(error) {


            console.error(
                "Firebase Load Error:",
                error
            );


            requestList.innerHTML = `

                <div class="error">

                    ❌ আবেদনগুলি লোড করা যাচ্ছে না।

                    <br><br>

                    ${
                        error &&
                        error.code
                        ?
                        "Firebase Error: " +
                        escapeHtml(error.code)
                        :
                        "Firebase Database Rules অথবা Login পরীক্ষা করুন।"
                    }

                </div>

            `;

        }

    );

}

</script></body></html>
