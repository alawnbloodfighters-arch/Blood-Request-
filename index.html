<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ব্লাড রিকুয়েস্ট</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<h1>🩸 আল-আওন ব্লাড ফাইটার্স</h1>

<p>ব্লাড রিকুয়েস্ট ফর্ম</p>

</div>

<div class="card">

<form id="bloodRequestForm">

<label>🩺 রোগের সমস্যা</label>

<input
type="text"
id="problem"
placeholder="রোগের সমস্যা লিখুন"
required>

<label>🩸 রক্তের গ্রুপ</label>

<select id="bloodGroup" required>

<option value="">নির্বাচন করুন</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

<label>🧪 হিমোগ্লোবিন</label>

<input
type="number"
id="hemoglobin"
step="0.1"
placeholder="যেমন 8.5"
required>
<label>📅 রক্তদানের তারিখ</label>

<input
type="date"
id="date"
required>

<label>🕒 রক্তদানের সময়</label>

<input
type="time"
id="time"
required>

<label>🏥 হাসপাতালের নাম</label>

<input
type="text"
id="hospital"
placeholder="হাসপাতালের নাম লিখুন"
required>

<label>📱 যোগাযোগ নম্বর</label>

<input
type="tel"
id="mobile"
maxlength="11"
placeholder="01XXXXXXXXX"
required>

<label>📝 অতিরিক্ত তথ্য</label>

<textarea
id="note"
rows="4"
placeholder="প্রয়োজন হলে অতিরিক্ত তথ্য লিখুন"></textarea>

<button type="submit">

🩸 রিকুয়েস্ট পাঠান

</button>

</form>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
