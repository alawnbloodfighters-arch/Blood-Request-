<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ব্লাড রিকুয়েস্ট</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <img src="logo.png" class="logo" alt="Logo">

        <h1>🩸 আল-আওন ব্লাড ফাইটার্স</h1>

        <p>ব্লাড রিকুয়েস্ট ফর্ম</p>

    </div>


    <div class="card">

        <form id="bloodRequestForm">


            <!-- =========================
                 রেফারেন্স
            ========================== -->

            <label>👤 রেফারেন্স</label>

            <input
                type="text"
                id="reference"
                placeholder="আপনার নাম লিখুন"
                required
            >


            <!-- =========================
                 রোগীর সমস্যা
            ========================== -->

            <label>🩺 রোগীর সমস্যা</label>

            <input
                type="text"
                id="problem"
                placeholder="রোগীর সমস্যা লিখুন"
                required
            >


            <!-- =========================
                 রক্তের গ্রুপ
            ========================== -->

            <label>🩸 রক্তের গ্রুপ</label>

            <select id="bloodGroup" required>

                <option value="">নির্বাচন করুন</option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>

                <option value="B+">B+</option>
                <option value="B-">B-</option>

                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>

                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>


            <!-- =========================
                 হিমোগ্লোবিন
            ========================== -->

            <label>🧪 হিমোগ্লোবিন</label>

            <input
                type="number"
                id="hemoglobin"
                step="0.1"
                min="0"
                placeholder="যেমন 8.5"
                required
            >


            <!-- =========================
                 রক্তদানের তারিখ
            ========================== -->

            <label>📅 রক্তদানের তারিখ</label>

            <input
                type="date"
                id="date"
                required
            >


            <!-- =========================
                 রক্তদানের সময়
            ========================== -->

            <label>🕒 রক্তদানের সময়</label>

            <input
                type="text"
                id="time"
                placeholder="রক্তদানের সময় লিখুন"
                required
            >


            <!-- =========================
                 হাসপাতাল
            ========================== -->

            <label>🏥 হাসপাতালের নাম</label>

            <input
                type="text"
                id="hospital"
                placeholder="হাসপাতালের নাম লিখুন"
                required
            >


            <!-- =========================
                 রোগীর লোকের মোবাইল
            ========================== -->

            <label>📱 যোগাযোগ নম্বর</label>

            <input
                type="tel"
                id="mobile"
                maxlength="11"
                inputmode="numeric"
                pattern="01[0-9]{9}"
                placeholder="01XXXXXXXXX"
                required
            >


            <!-- =========================
                 অতিরিক্ত তথ্য
            ========================== -->

            <label>📝 অতিরিক্ত তথ্য</label>

            <textarea
                id="note"
                rows="4"
                placeholder="প্রয়োজন হলে অতিরিক্ত তথ্য লিখুন"
            ></textarea>


            <!-- =========================
                 Submit
            ========================== -->

            <button type="submit" id="submitButton">

                🩸 রিকুয়েস্ট পাঠান

            </button>


        </form>

    </div>

</div>



<script>


// ==========================================
// FORM ELEMENT
// ==========================================

const form =
    document.getElementById(
        "bloodRequestForm"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );



// ==========================================
// NEW GOOGLE APPS SCRIPT URL
// ==========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzJLYulqrxXeJeyt2tZhKI34eSed-dx6LMca2JaxVQttdRFtWfDXUnEt1n4nW0l7Tfp8Q/exec";



// ==========================================
// FORM SUBMIT
// ==========================================

form.addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();


        // ==================================
        // Button Disable
        // ==================================

        submitButton.disabled = true;

        submitButton.innerText =
            "⏳ পাঠানো হচ্ছে...";



        // ==================================
        // Mobile Number
        // String হিসেবে নেওয়া হচ্ছে
        // ==================================

        const mobile =
            String(
                document
                    .getElementById("mobile")
                    .value
                    .trim()
            );



        // ==================================
        // Form Data
        // ==================================

        const data = {

            reference:
                document
                    .getElementById("reference")
                    .value
                    .trim(),


            problem:
                document
                    .getElementById("problem")
                    .value
                    .trim(),


            bloodGroup:
                document
                    .getElementById("bloodGroup")
                    .value,


            hemoglobin:
                document
                    .getElementById("hemoglobin")
                    .value,


            /*
               Date input থেকে
               YYYY-MM-DD String যাবে
            */

            date:
                document
                    .getElementById("date")
                    .value,


            time:
                document
                    .getElementById("time")
                    .value
                    .trim(),


            hospital:
                document
                    .getElementById("hospital")
                    .value
                    .trim(),


            /*
               রোগীর লোকের নম্বর
               0 সহ String হিসেবে পাঠানো হবে
            */

            mobile:
                mobile,


            note:
                document
                    .getElementById("note")
                    .value
                    .trim()

        };



        // ==================================
        // Reference Validation
        // ==================================

        if (data.reference === "") {

            alert(
                "⚠️ আপনার নাম লিখুন।"
            );


            submitButton.disabled = false;

            submitButton.innerText =
                "🩸 রিকুয়েস্ট পাঠান";

            return;

        }



        // ==================================
        // Mobile Validation
        // ==================================

        if (
            !/^01[0-9]{9}$/.test(
                data.mobile
            )
        ) {


            alert(
                "⚠️ সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।"
            );


            submitButton.disabled = false;

            submitButton.innerText =
                "🩸 রিকুয়েস্ট পাঠান";

            return;

        }



        // ==================================
        // Time Validation
        // ==================================

        if (data.time === "") {


            alert(
                "⚠️ রক্তদানের সময় লিখুন।"
            );


            submitButton.disabled = false;

            submitButton.innerText =
                "🩸 রিকুয়েস্ট পাঠান";

            return;

        }



        // ==================================
        // Date Validation
        // ==================================

        if (data.date === "") {


            alert(
                "⚠️ রক্তদানের তারিখ নির্বাচন করুন।"
            );


            submitButton.disabled = false;

            submitButton.innerText =
                "🩸 রিকুয়েস্ট পাঠান";

            return;

        }



        // ==================================
        // SEND DATA
        // ==================================

        try {


            const response =
                await fetch(
                    SCRIPT_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );



            // ==================================
            // Response
            // ==================================

            const result =
                await response.json();



            // ==================================
            // Success
            // ==================================

            if (result.success) {


                alert(
                    "✅ রক্তের রিকুয়েস্ট সফলভাবে পাঠানো হয়েছে।"
                );


                form.reset();


            } else {


                alert(

                    "❌ রিকুয়েস্ট পাঠানো যায়নি।\n\n" +

                    (
                        result.error ||
                        "অজানা সমস্যা হয়েছে।"
                    )

                );

            }


        } catch (error) {


            console.error(
                "Error:",
                error
            );


            alert(

                "❌ রিকুয়েস্ট পাঠানো যায়নি।\n\n" +

                "ইন্টারনেট সংযোগ অথবা সার্ভারের সমস্যা হতে পারে।"

            );

        }



        // ==================================
        // Button আবার চালু
        // ==================================

        submitButton.disabled = false;

        submitButton.innerText =
            "🩸 রিকুয়েস্ট পাঠান";

    }

);

</script>


</body>

</html>
